openapi: 3.1.0
info:
  title: AFX-CORE Identity & Authorization API
  version: 1.0.0
  description: Canonical security-plane contract for AFAGHX.
servers:
  - url: /api/core/v1
paths:
  /sessions/introspect:
    post:
      operationId: introspectSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session and security context
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /authorization/check:
    post:
      operationId: checkAuthorization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCheck'
      responses:
        '200':
          description: Policy decision
        '401':
          description: Unauthenticated
        '403':
          description: Denied
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthorizationCheck:
      type: object
      required: [action, resource]
      properties:
        action:
          type: string
        resource:
          type: object
          required: [type]
          properties:
            type: { type: string }
            id: { type: string }
            tenantId: { type: string, format: uuid }
