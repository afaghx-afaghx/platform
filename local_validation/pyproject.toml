[project]
name = "afaghx-crewai-engineering-assistant"
version = "1.0.0"
description = "Governed CrewAI coding assistant for the AFAGHX repository"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[openai]==1.15.17"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "governance.py", "validate_project.py", "README.md"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
