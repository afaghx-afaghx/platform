name: AFX-PLATFORM

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'docs/architecture/AFX-PLATFORM-001.md'
      - 'docs/architecture/AFX-PLATFORM-MODULE-REGISTRY.md'
      - 'docs/architecture/adr/ADR-002-afx-platform-boundary.md'
      - '.github/workflows/afx-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run Gateway contract tests
        run: node --test platform/Gateway/*.test.js
      - name: Diff validation
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
