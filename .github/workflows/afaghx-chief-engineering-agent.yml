name: AFAGHX Chief Engineering Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent operating mode
        required: true
        type: choice
        options: [forensics, architect, plan, implement, security, verify, evidence, remediate, release-gate]
        default: forensics
      task:
        description: Engineering mission
        required: true
        type: string
      model:
        description: Optional Codex model override
        required: false
        type: string
        default: ''
      effort:
        description: Reasoning effort
        required: true
        type: choice
        options: [low, medium, high]
        default: high
  push:
    branches:
      - ai/afaghx-chief-engineering-agent-v1
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: afaghx-chief-engineering-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate agent control plane
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/agents/afaghx-chief-engineering-agent.md
          test -f .ai/policies/engineering.md
          test -f .ai/evidence/evidence-schema.yaml
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

  deterministic-runtime:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run deterministic operational control plane
        run: |
          set -euo pipefail
          python3 .ai/runtime/forensics.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-chief-engineering-runtime-${{ github.run_id }}
          path: agent-evidence/
          if-no-files-found: error

  model-runtime:
    needs: preflight
    runs-on: ubuntu-latest
    environment: afaghx-ai-execute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Capture baseline
        run: git rev-parse HEAD > baseline-sha.txt

      - name: Detect configured model provider
        id: provider
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "provider=copilot" >> "$GITHUB_OUTPUT"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "provider=codex" >> "$GITHUB_OUTPUT"
          else
            echo "No real AI provider credential is configured." >&2
            echo "For this user-owned repository, configure COPILOT_GITHUB_TOKEN with Copilot Requests permission, or provide an OpenAI API key with available credits." >&2
            exit 1
          fi

      - name: Set up Node.js for Copilot CLI
        if: steps.provider.outputs.provider == 'copilot'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: steps.provider.outputs.provider == 'copilot'
        run: npm install -g @github/copilot

      - name: Run AFAGHX Chief Engineering Agent via Copilot CLI
        if: steps.provider.outputs.provider == 'copilot'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'forensics' }}
          TASK: ${{ inputs.task || 'Continuous repository forensics and engineering-control-plane health check.' }}
        run: |
          set -euo pipefail
          copilot -p "You are AFX-AI-CEA-001, the AFAGHX Chief Engineering Agent.
          Read AGENTS.md, .ai/command-center.yaml, .ai/agents/afaghx-chief-engineering-agent.md,
          .ai/policies/*, .ai/architecture/*, .ai/contracts/* and .ai/evidence/* before acting.
          Operating mode: $MODE
          Mission: $TASK
          For push/scheduled execution, perform FORENSICS only: do not modify repository files.
          Inspect canonical runtime, authentication authorities, duplicate/legacy paths,
          persistence/migrations, security and tenant boundaries, CI/governance, and architectural drift.
          Use four perspectives: Architecture & Core; Security & Trust; Platform & Runtime; Experience & Product.
          Follow MISSION -> BASELINE -> FORENSICS -> ARCHITECTURE IMPACT -> SECURITY IMPACT ->
          PLAN -> IMPLEMENT (only when explicitly permitted) -> TEST -> EVIDENCE -> GATE -> PR.
          Never invent evidence, never call UNKNOWN GREEN, never write to main, never change secrets,
          never merge, never deploy. End with GO, NO-GO, or HUMAN-REVIEW and explain why.
          Include baseline SHA, changed-file status, architecture/security findings, tests, evidence,
          UNKNOWN/PARTIAL items, remediation/rollback, and gate decision." \
          --allow-tool='shell(git:*)' --no-ask-user -s > chief-engineering-agent-report.md
          test -s chief-engineering-agent-report.md

      - name: Run AFAGHX Chief Engineering Agent via Codex
        if: steps.provider.outputs.provider == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: chief-engineering-agent-report.md
          prompt: |
            You are AFX-AI-CEA-001, the AFAGHX Chief Engineering Agent.
            Read AGENTS.md, .ai/command-center.yaml, .ai/agents/afaghx-chief-engineering-agent.md,
            .ai/policies/*, .ai/architecture/*, .ai/contracts/* and .ai/evidence/* before acting.
            Operating mode: ${{ inputs.mode || 'forensics' }}
            Mission: ${{ inputs.task || 'Continuous repository forensics and engineering-control-plane health check.' }}
            For push/scheduled execution, perform FORENSICS only and do not modify files.
            Inspect canonical runtime, authentication authorities, duplicate/legacy paths, persistence,
            security and tenant boundaries, CI/governance, and architectural drift.
            Use all four perspectives and the governed MISSION->...->PR sequence.
            Never invent evidence, never call UNKNOWN GREEN, never write to main, never modify secrets,
            never merge or deploy. End with GO, NO-GO, or HUMAN-REVIEW with evidence and unknowns.

      - name: Verify model evidence
        run: |
          set -euo pipefail
          test -s chief-engineering-agent-report.md
          test -s baseline-sha.txt
          printf '%s\n' "model_runtime=SUCCESS" > model-runtime-status.txt
          printf '%s\n' "provider=${{ steps.provider.outputs.provider }}" >> model-runtime-status.txt

      - name: Upload model evidence
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-chief-engineering-agent-${{ github.run_id }}
          path: |
            chief-engineering-agent-report.md
            baseline-sha.txt
            model-runtime-status.txt
          if-no-files-found: error

  release-gate:
    needs: [deterministic-runtime, model-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Final runtime gate
        run: |
          set -euo pipefail
          echo "AFAGHX Chief Engineering Agent runtime = GREEN"
          echo "deterministic_runtime = SUCCESS"
          echo "model_runtime = SUCCESS"
          echo "No synthetic GREEN is permitted."
