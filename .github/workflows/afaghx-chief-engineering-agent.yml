name: AFAGHX Chief Engineering Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent operating mode
        required: true
        type: choice
        options: [forensics, architect, plan, implement, security, verify, evidence, remediate, release-gate]
        default: implement
      task:
        description: Optional override mission; otherwise first READY task is selected
        required: false
        type: string
        default: ''
  push:
    branches:
      - ai/afaghx-chief-engineering-agent-v1
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: afaghx-chief-engineering-agent-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: control-plane-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate control plane
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/agents/afaghx-chief-engineering-agent.md
          test -f .ai/policies/engineering.md
          test -f .ai/evidence/evidence-schema.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/forensics.py
          test -f .ai/runtime/agent-loop.py
          test -f platform/Gateway/runtime.mjs
          test -f platform/Gateway/runtime.integration.test.mjs
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

  core-runtime-gate:
    name: canonical-core-runtime-gate
    needs: preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install AFX-CORE dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Execute autonomous task verifier
        run: |
          set -euo pipefail
          python3 .ai/runtime/agent-loop.py
      - name: Run mandatory security tests
        working-directory: core/AFX-CORE
        run: npm run test:security
      - name: Upload Task/Gate/Evidence
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-task-gate-evidence-${{ github.run_id }}
          path: agent-evidence/
          if-no-files-found: error

  verify-model-runtime:
    name: real-model-runtime-verification
    needs: preflight
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute real Agent verification
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          copilot -p "You are AFX-AI-CEA-001.
          Read AGENTS.md, .ai/command-center.yaml, .ai/agents/afaghx-chief-engineering-agent.md,
          .ai/policies/*, .ai/architecture/*, .ai/contracts/*, .ai/evidence/* and .ai/tasks/queue.json.
          This is a read-only verification run.
          Inspect the current baseline and the canonical runtime path Gateway -> PersistentAfxCore -> PostgreSQL.
          Verify the READY task, its constraints, the authentication boundary, tenant isolation,
          and the evidence strategy. Run only read-only git/tests as needed.
          Never edit files, never commit, never push, never merge, never deploy.
          Finish with PROVEN, PARTIAL, or UNKNOWN for each evidence claim and an overall
          GO, NO-GO, or HUMAN-REVIEW decision." \
          -s \
          --available-tools='bash,edit,view,grep,glob' \
          --deny-tool='write' \
          --allow-tool='shell(git status)' \
          --allow-tool='shell(git show)' \
          --allow-tool='shell(git diff)' \
          --allow-tool='shell(node --test)' \
          --allow-tool='shell(npm run test:*)' \
          > model-verification-report.md
          test -s model-verification-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-model-verification-${{ github.run_id }}
          path: model-verification-report.md
          if-no-files-found: error

  autonomous-work-loop:
    name: autonomous-task-implement-test-evidence-pr
    needs: [preflight]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select task and create isolated work branch
        id: task
        shell: bash
        run: |
          set -euo pipefail
          task_id="${{ inputs.task }}"
          if [ -z "$task_id" ]; then
            task_id="$(python3 - <<'PY'
          import json
          q=json.load(open('.ai/tasks/queue.json'))
          ready=[x for x in q.get('tasks',[]) if x.get('status')=='READY']
          print(ready[0]['id'] if ready else '')
          PY
          )"
          fi
          test -n "$task_id"
          safe="$(printf '%s' "$task_id" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')"
          work_branch="ai/auto/${safe}-${GITHUB_RUN_ID}"
          git switch -c "$work_branch"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "work_branch=$work_branch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute Agent implementation loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          REQUESTED_MODE: ${{ inputs.mode || 'implement' }}
          TASK_OVERRIDE: ${{ inputs.task }}
        run: |
          set -euo pipefail
          copilot -p "You are AFX-AI-CEA-001 executing a governed autonomous engineering task.
          Task ID: $TASK_ID
          Requested mode: $REQUESTED_MODE
          Task override: $TASK_OVERRIDE
          Read AGENTS.md, .ai/command-center.yaml, .ai/agents/afaghx-chief-engineering-agent.md,
          .ai/policies/*, .ai/architecture/*, .ai/contracts/*, .ai/evidence/* and .ai/tasks/queue.json.
          Select the named task or the first READY task. Execute the mission in the repository workspace.
          You are allowed to edit implementation files and tests in this isolated branch.
          Keep AFX-CORE as the sole identity/authentication/authorization authority.
          Keep Experience presentation-only. Maintain Gateway -> PersistentAfxCore -> PostgreSQL.
          Run the required deterministic verification. Do not change AGENTS.md or .ai/policies/*.
          Do not push, merge, deploy, or access secrets. Do not fabricate evidence.
          When verification passes, leave the task state ready for the deterministic loop to mark DONE.
          When verification fails, stop and explain the blocker.
          Produce concise execution notes in $PWD/agent-execution-notes.md." -s
          --available-tools='bash,edit,view,grep,glob'
          --allow-tool='write'
          --allow-tool='shell(git status)'
          --allow-tool='shell(git diff)'
          --allow-tool='shell(git show)'
          --allow-tool='shell(node --test)'
          --allow-tool='shell(npm run test:*)'
          --allow-tool='shell(npm ci)'
          --deny-tool='shell(git push)'
          --deny-tool='shell(git merge)'
          --deny-tool='shell(gh)'
          --deny-tool='shell(rm)'
          --deny-tool='shell(sudo)'
      - name: Run Task/Gate/Evidence loop after Agent
        run: |
          set -euo pipefail
          cd core/AFX-CORE
          npm ci --no-audit --no-fund
          cd ../..
          python3 .ai/runtime/agent-loop.py
          npm --prefix core/AFX-CORE run test:security
      - name: Enforce protected governance files
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD || true)"
          if echo "$changed" | grep -Eq '^(AGENTS.md|\.ai/policies/)'; then
            echo "Protected governance files were modified by autonomous loop."
            exit 1
          fi
          if echo "$changed" | grep -q '^\.github/workflows/'; then
            if ! echo "$changed" | grep -qE '^\.ai/architecture/adr/'; then
              echo "Workflow changes require an ADR in .ai/architecture/adr/."
              exit 1
            fi
          fi
      - name: Capture changed-file manifest
        run: git diff --name-status origin/main...HEAD > agent-evidence/changed-files.txt
      - name: Commit autonomous task result
        run: |
          set -euo pipefail
          test -f agent-evidence/task-loop.json
          git diff --check
          git config user.name "AFAGHX Chief Engineering Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AI: execute ${{ steps.task.outputs.task_id }} autonomous work loop"
      - name: Push isolated branch
        run: git push --set-upstream origin "${{ steps.task.outputs.work_branch }}"
      - name: Open governed pull request
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          WORK_BRANCH: ${{ steps.task.outputs.work_branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$WORK_BRANCH" \
            --title "AI: $TASK_ID — autonomous task result" \
            --body "Executed by AFX-AI-CEA-001. Task/Gate/Evidence artifacts are attached to the workflow run. Human review and merge remain mandatory. No production deployment was performed."
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-autonomous-work-loop-${{ github.run_id }}
          path: |
            agent-evidence/
            agent-execution-notes.md
          if-no-files-found: error

  final-release-gate:
    name: final-runtime-task-evidence-gate
    needs: [preflight, core-runtime-gate, verify-model-runtime, autonomous-work-loop]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate final gate
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          CORE: ${{ needs.core-runtime-gate.result }}
          MODEL: ${{ needs.verify-model-runtime.result }}
          AUTONOMOUS: ${{ needs.autonomous-work-loop.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "preflight=$PREFLIGHT"
          echo "core_runtime=$CORE"
          echo "model_runtime=$MODEL"
          echo "autonomous_loop=$AUTONOMOUS"

          test "$PREFLIGHT" = "success"
          test "$CORE" = "success"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            test "$MODEL" = "success"
            echo "FINAL GATE: GREEN — Core runtime and real model verification both succeeded."
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$AUTONOMOUS" = "success"
            echo "FINAL GATE: GREEN — autonomous Task/Gate/Evidence/PR loop succeeded."
          else
            echo "FINAL GATE: NO-GO — unsupported event."
            exit 1
          fi
