name: AFX-CORE Gate 01

on:
  push:
    paths:
      - 'docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
      - 'core/AFX-CORE/**'
      - '.github/workflows/afx-core-gate-01.yml'
  pull_request:

permissions:
  contents: read

jobs:
  closure-matrix:
    name: closure-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Gate 01 scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(core/AFX-CORE/|docs/security/)'; then
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforce=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Gate 01 matrix
        if: steps.scope.outputs.enforce == 'true'
        shell: bash
        run: |
          set -euo pipefail
          matrix='docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
          test -s "$matrix"
          grep -q '^## Closure matrix' "$matrix"
          grep -q 'G01-26' "$matrix"

          if grep -qE '\| (IN PROGRESS|BLOCKED) \|' "$matrix"; then
            echo 'AFX-CORE Gate 01 is RED: unresolved controls remain.'
            grep -E '\| (IN PROGRESS|BLOCKED) \|' "$matrix" || true
            exit 1
          fi

          echo 'AFX-CORE Gate 01 closure matrix is GREEN.'

      - name: Record Gate 01 not applicable
        if: steps.scope.outputs.enforce != 'true'
        run: echo 'Gate 01 matrix validation is not applicable to this PR because it contains no AFX-CORE core/security changes.'

  bootstrap-security-tests:
    name: bootstrap-security-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run AFX-CORE security tests
        working-directory: core/AFX-CORE
        run: npm test
