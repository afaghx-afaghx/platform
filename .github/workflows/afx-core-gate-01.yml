name: AFX-CORE Gate 01

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  closure-matrix:
    name: closure-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed file set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" > changed-files.txt
          else
            git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" > changed-files.txt
          fi
          echo "Changed paths:"
          cat changed-files.txt

      - name: Test Gate-01 policy contract
        run: node --test scripts/gate01-policy.test.mjs

      - name: Validate Gate-01 matrix and enforce Domain Freeze
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md
          node scripts/gate01-policy.mjs \
            --matrix docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md \
            --changed-files changed-files.txt \
            --event "${GITHUB_EVENT_NAME}"

      - name: Preserve fail-closed production truth
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\*\*GATE 01 = RED / OPEN\.\*\*$\|^\*\*GATE 01 = RED / OPEN\.\*\*' docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md || {
            grep -q 'GATE 01 = RED / OPEN' docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md
          }

  bootstrap-security-tests:
    name: bootstrap-security-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install locked dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Run AFX-CORE bootstrap security tests
        working-directory: core/AFX-CORE
        run: npm run test:security
