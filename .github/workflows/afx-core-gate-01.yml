name: AFX-CORE Gate 01

on:
  push:
    paths:
      - 'docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
      - 'docs/security/AFX-CORE-GATE-01-FOUR-TEAM-CLOSURE-PLAN.md'
      - 'core/AFX-CORE/**'
      - '.github/workflows/afx-core-gate-01.yml'
  pull_request:
    paths:
      - 'docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
      - 'docs/security/AFX-CORE-GATE-01-FOUR-TEAM-CLOSURE-PLAN.md'
      - 'core/AFX-CORE/**'
      - '.github/workflows/afx-core-gate-01.yml'

permissions:
  contents: read

jobs:
  closure-matrix:
    name: closure-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gate 01 matrix and four-team enforcement
        shell: bash
        run: |
          set -euo pipefail
          matrix='docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
          test -s "$matrix"
          grep -q '^## Closure matrix' "$matrix"
          grep -q '\*\*GATE 01 = RED / OPEN\.\*\*' "$matrix"

          # The canonical Gate-01 matrix must enumerate every control exactly once.
          controls=$(grep -E '^\| G01-[0-9]{2} \|' "$matrix" | wc -l)
          test "$controls" -eq 26
          for id in $(seq -w 1 26); do
            count=$(grep -E "^\| G01-$id \|" "$matrix" | wc -l)
            test "$count" -eq 1
          done

          # Fail closed: any unfinished, unknown, or blocked control prevents GREEN.
          if grep -qE '^\| G01-[0-9]{2} \|.*\| (IN PROGRESS|BLOCKED|UNKNOWN) \|' "$matrix"; then
            echo 'AFX-CORE Gate 01 = RED: unresolved control status exists.'
            grep -E '^\| G01-[0-9]{2} \|.*\| (IN PROGRESS|BLOCKED|UNKNOWN) \|' "$matrix" || true
            exit 1
          fi

          # GREEN requires the explicit decision and the freeze removal.
          grep -qE '^\*\*GATE 01 = GREEN( / CLOSED)?\.\*\*' "$matrix"
          if grep -q '^\*\*Domain Freeze:\*\* ACTIVE' "$matrix"; then
            echo 'AFX-CORE Gate 01 = RED: Domain Freeze is still active.'
            exit 1
          fi

          # Four-team governance surface is mandatory.
          grep -q 'Team 1 — Architecture & Core Security' "$matrix"
          grep -q 'Team 2 — Platform, Reliability & DevSecOps' "$matrix"
          grep -q 'Team 3 — Domain & Product Engineering' "$matrix"
          grep -q 'Team 4 — Data, Intelligence & AI' "$matrix"

          # AI/evidence cannot self-approve a GREEN decision.
          grep -q 'AI may analyze, propose, test and remediate, but it cannot self-authorize a GREEN decision' "$matrix"

          echo 'Gate 01 matrix satisfies the structural contract; unresolved controls will fail closed until genuinely closed.'

  bootstrap-security-tests:
    name: bootstrap-security-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Run AFX-CORE security suite
        working-directory: core/AFX-CORE
        run: npm run test:security

  gate-decision:
    name: gate-decision
    needs: [closure-matrix, bootstrap-security-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enforce release decision
        shell: bash
        run: |
          set -euo pipefail
          matrix='docs/security/AFX-CORE-GATE-01-CLOSURE-MATRIX.md'
          decision=$(grep -E '^\*\*GATE 01 = ' "$matrix" | head -1)
          echo "${decision}"
          echo "$decision" | grep -q 'GREEN'
          ! grep -qE '^\| G01-[0-9]{2} \|.*\| (IN PROGRESS|BLOCKED|UNKNOWN) \|' "$matrix"
          ! grep -q '^\*\*Domain Freeze:\*\* ACTIVE' "$matrix"
          echo 'Gate 01 release decision = PASS.'