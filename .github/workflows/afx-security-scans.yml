name: AFAGHX Security Scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/AFX-CORE
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare report directory
        run: mkdir -p artifacts/security
      - name: Gitleaks v8.29.1
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438 \
            detect --source /repo --redact --report-format json --report-path /repo/artifacts/security/gitleaks.json --exit-code 0
      - name: Summarize Gitleaks findings without exposing secrets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(jq 'length' artifacts/security/gitleaks.json)"
          echo "Gitleaks findings: $count"
          if [ "$count" -gt 0 ]; then
            {
              echo '## Gitleaks findings'
              echo
              echo '| Rule | Description | File | Line |'
              echo '|---|---|---|---|'
              jq -r '.[] | "| " + .RuleID + " | " + .Description + " | " + .File + " | " + ((.StartLine // 0)|tostring) + " |"' artifacts/security/gitleaks.json
            } > artifacts/security/gitleaks-summary.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file artifacts/security/gitleaks-summary.md
            exit 1
          fi
      - name: Upload Gitleaks JSON and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: |
            artifacts/security/gitleaks.json
            artifacts/security/gitleaks-summary.md

  sast:
    name: sast-codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:javascript

  filesystem-scan:
    name: trivy-filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare report directory
        run: mkdir -p artifacts/security
      - name: Trivy 0.74.0 filesystem vulnerability/secret/misconfiguration scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            aquasec/trivy:0.74.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output /repo/artifacts/security/trivy-results.sarif --exit-code 1 /repo
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: artifacts/security/trivy-results.sarif