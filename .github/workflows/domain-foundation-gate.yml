name: Domain Foundation Gate

on:
  pull_request:
    paths:
      - 'domains/**'
      - '.github/workflows/domain-foundation-gate.yml'
  push:
    branches: [main]
    paths:
      - 'domains/**'
      - '.github/workflows/domain-foundation-gate.yml'

permissions:
  contents: read

jobs:
  domain-foundation:
    name: Domain Foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical domain registry
        run: node domains/validate-domain-foundation.mjs
      - name: Verify foundation specification exists
        run: test -s domains/DOMAIN-FOUNDATION.md
      - name: Execute eleven-domain runtime tests
        run: node --test domains/runtime/domain-runtime.test.mjs
      - name: Execute canonical domain API tests
        run: node --test domains/runtime/domain-api.test.mjs
      - name: Verify canonical API contract
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('domains/runtime/domain-api.openapi.yaml','utf8'); for (const d of ['product','commerce','order','factory','supplier','service','partner','marketing','advertising','logistics','payment']) if (!s.includes(d)) throw new Error('missing_domain:'+d)"
