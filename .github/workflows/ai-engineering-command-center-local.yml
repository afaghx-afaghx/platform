name: AFAGHX Autonomous Engineering Agent — Local-First

# PRIMARY AGENT PATH: local Ollama + OpenCode. No paid API is required.

on:
  push:
    branches:
      - fix/ai-assistant-runtime-reliability
  workflow_dispatch:
    inputs:
      mode:
        description: Agent operating mode
        required: true
        type: choice
        options: [plan, audit, implement, golden-execution, security, verify]
        default: golden-execution
      task:
        description: Governed task ID
        required: true
        type: string
        default: AFX-GOLDEN-LOCAL-001
      model:
        description: Local Ollama model in provider/model form
        required: true
        type: string
        default: ollama/qwen2.5-coder:14b
      runner_target:
        description: Run on an ephemeral GitHub-hosted Linux VM or a provisioned self-hosted Ollama runner
        required: true
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
      expected_sha:
        description: Exact immutable candidate SHA to execute; must match the selected workflow ref
        required: true
        type: string

concurrency:
  group: afaghx-autonomous-engineering-agent-local-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Agent Preflight
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AFX-GOLDEN-EXECUTE]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate local-first control plane
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/providers.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/agent-loop.py
          test -f .ai/runtime/forensics.py
          test -f .ai/runtime/task_scope_guard.py
          test -f .ai/runtime/task_scope_guard_contract_test.py
          test -f scripts/ai/validate-local-provider-contract.mjs
          test -f scripts/ai/include-untracked-in-diff.sh
          test -f scripts/ai/scan-candidate-secrets.py
          test -f scripts/ai/test-candidate-secret-scanner.py
          test -f .ai/runtime/golden-execution.contract.test.mjs
          test -f .opencode/agents/afaghx-engineer.md
          test -f opencode.json
          test -f scripts/ai/local-agent-preflight.sh
          test -f scripts/ai/run-local-agent.sh
          python3 -m json.tool .ai/tasks/queue.json >/dev/null
          python3 -m json.tool opencode.json >/dev/null
          python3 scripts/ai/test-candidate-secret-scanner.py
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

      - name: Validate exact immutable candidate SHA, task and governed mode
        env:
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
          MODE: ${{ inputs.mode || 'golden-execution' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" "$MODE" "$EXPECTED_SHA" "$EVENT_SHA" <<'PY'
          import json, re, subprocess, sys
          task_id, mode, expected_sha, event_sha = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("expected_sha must be a full 40-character lowercase commit SHA")
          if expected_sha != event_sha:
              raise SystemExit(f"Ref/SHA mismatch: expected_sha={expected_sha}, workflow_ref_sha={event_sha}")
          checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if checked_out != expected_sha:
              raise SystemExit(f"Checkout mismatch: HEAD={checked_out}, expected_sha={expected_sha}")
          print(f"IMMUTABLE_SOURCE_SHA={checked_out}")
          with open('.ai/tasks/queue.json', encoding='utf-8') as source:
              q = json.load(source)
          task = next((x for x in q.get('tasks', []) if x.get('id') == task_id), None)
          if not task:
              raise SystemExit(f"Unknown task: {task_id}")
          if task.get('status') != 'READY':
              raise SystemExit(f"Task is not READY: {task_id}")
          if task.get('mode') != mode:
              raise SystemExit(f"Requested mode is not governed for task {task_id}")
          PY
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "STALE_CANDIDATE: autonomous execution is branch-bound." >&2
            exit 1
          fi
          current_branch_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$current_branch_sha" || "$current_branch_sha" != "$EXPECTED_SHA" ]]; then
            echo "STALE_CANDIDATE: remote branch HEAD=${current_branch_sha:-MISSING} expected=$EXPECTED_SHA" >&2
            exit 1
          fi
          echo "CURRENT_BRANCH_HEAD_SHA=$current_branch_sha"

      - name: Validate local model selector
        env:
          MODEL: ${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          model = os.environ.get("MODEL", "")
          if not re.fullmatch(r"ollama/[A-Za-z0-9][A-Za-z0-9._:-]*", model):
              raise SystemExit("Model must be ollama/<local-model-tag> using only safe model-tag characters.")
          PY

  autonomous-execution:
    name: Local Golden Execution / Autonomous Engineering
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AFX-GOLDEN-EXECUTE]')) }}
    needs: preflight
    runs-on: ${{ (inputs.runner_target || 'github-hosted') == 'self-hosted' && fromJSON('["self-hosted", "linux", "x64", "afaghx-ai"]') || 'ubuntu-24.04' }}
    environment: afaghx-ai-execute
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
      TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      AFAGHX_LOCAL_MODEL: ${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}
      RUNNER_TARGET: ${{ inputs.runner_target || 'github-hosted' }}
      OLLAMA_URL: http://127.0.0.1:11434
      OPENCODE_CLI_VERSION: '2.0.28'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify and capture immutable candidate baseline
        id: baseline
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "STALE_CANDIDATE: autonomous execution is branch-bound." >&2
            exit 1
          fi
          current_branch_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$current_branch_sha" || "$current_branch_sha" != "$EXPECTED_SHA" ]]; then
            echo "STALE_CANDIDATE: remote branch HEAD=${current_branch_sha:-MISSING} expected=$EXPECTED_SHA" >&2
            exit 1
          fi
          echo "CURRENT_BRANCH_HEAD_SHA=$current_branch_sha"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_SOURCE_SHA=$actual_sha"

      - name: Reclaim unused SDK space for local model (GitHub-hosted only)
        if: ${{ (inputs.runner_target || 'github-hosted') == 'github-hosted' }}
        run: |
          set -euo pipefail
          echo "RUNNER_TARGET=github-hosted"
          echo "Before cleanup:"
          df -h /
          # This is an ephemeral hosted VM; remove only unused preinstalled SDKs.
          for path in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift /opt/hostedtoolcache/CodeQL; do
            if [[ -e "$path" ]]; then
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          echo "After cleanup:"
          df -h /
          available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d '[:space:]')"
          required_bytes=$((10 * 1024 * 1024 * 1024))
          if (( available_bytes < required_bytes )); then
            echo "OLLAMA_DISK_BUDGET_FAILED: need at least 10 GiB free after cleanup." >&2
            exit 1
          fi

      - name: Bootstrap ephemeral local Ollama runtime (GitHub-hosted only)
        if: ${{ (inputs.runner_target || 'github-hosted') == 'github-hosted' }}
        env:
          MODEL: ${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}
        run: |
          set -euo pipefail
          if [[ "$MODEL" != "ollama/qwen2.5-coder:14b" ]]; then
            echo "HOSTED_MODEL_NOT_APPROVED: hosted fallback is pinned to ollama/qwen2.5-coder:14b." >&2
            exit 1
          fi
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sudo sh /tmp/ollama-install.sh
          sudo systemctl enable --now ollama
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            sudo journalctl -u ollama --no-pager -n 100 || true
            echo "OLLAMA_STARTUP_FAILED" >&2
            exit 1
          fi
          model="${MODEL#ollama/}"
          ollama pull "$model"
          ollama list
          echo "OLLAMA_MODEL_READY=$model"
          echo "Runtime capacity after model download:"
          free -h
          df -h /

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ensure pinned OpenCode CLI v2 is available
        run: |
          set -euo pipefail
          expected="${OPENCODE_CLI_VERSION}"
          installed="$(opencode --version 2>/dev/null || true)"
          if [[ "$installed" != *"$expected"* ]]; then
            npm install -g "@opencode/cli@${OPENCODE_CLI_VERSION}" --no-audit --no-fund
          fi
          actual="$(opencode --version 2>&1 | tr -d '\r')"
          if [[ "$actual" != *"$expected"* ]]; then
            echo "opencode_version_mismatch expected=$expected actual=$actual" >&2
            exit 1
          fi
          echo "opencode_version=$actual"

      - name: Verify local AI runtime
        run: |
          set -euo pipefail
          model="${AFAGHX_LOCAL_MODEL#ollama/}"
          AFAGHX_LOCAL_MODEL="$model" OLLAMA_URL="$OLLAMA_URL" bash scripts/ai/local-agent-preflight.sh

      - name: Execute governed local Agent
        run: |
          set -euo pipefail
          bash scripts/ai/run-local-agent.sh

      - name: Enforce immutable git baseline
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          git diff --check

      - name: Enforce immutable task scope
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
          MODE: ${{ inputs.mode || 'golden-execution' }}
        run: |
          set -euo pipefail
          python3 .ai/runtime/task_scope_guard.py "$TASK_ID" "$MODE" "$BASELINE_SHA"

      - name: Run forensic baseline evidence
        run: python3 .ai/runtime/forensics.py

      - name: Syntax-check agent-authored provider contract without executing it
        if: ${{ (inputs.mode || 'golden-execution') == 'golden-execution' }}
        run: node --check .ai/runtime/local-provider.contract.test.mjs

      - name: Validate provider contract source and live configuration without executing candidate code
        run: node scripts/ai/validate-local-provider-contract.mjs

      - name: Run Golden Execution governance contract
        run: node --test .ai/runtime/golden-execution.contract.test.mjs

      - name: Run canonical Core runtime
        run: node --test platform/Gateway/runtime.integration.test.mjs

      - name: Run AFX-CORE security suite
        working-directory: core/AFX-CORE
        run: npm run test:security

      - name: Run deterministic Task/Gate/Evidence loop
        env:
          AFX_TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
        run: python3 .ai/runtime/agent-loop.py

      - name: Verify task-scoped execution evidence
        env:
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" <<'PY'
          import json, sys
          from pathlib import Path
          task_id=sys.argv[1]
          evidence=json.loads(Path('agent-evidence/task-loop.json').read_text())
          if evidence.get('truth_scope') != 'task_execution':
              raise SystemExit('Wrong evidence scope')
          if evidence.get('task_id') != task_id:
              raise SystemExit('Evidence task id mismatch')
          if evidence.get('status') != 'VERIFY_SUCCESS' or evidence.get('truth_state') != 'TESTED':
              raise SystemExit('Task evidence is not successfully TESTED')
          if evidence.get('system_production_gate') != 'NOT_EVALUATED_BY_THIS_TASK_WORKFLOW':
              raise SystemExit('Task evidence improperly claims system gate evaluation')
          PY

      - name: Secret diff scan (tracked and untracked)
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/ai/include-untracked-in-diff.sh
          python3 scripts/ai/scan-candidate-secrets.py "$BASELINE_SHA"

      - name: Build machine evidence
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
          MODE: ${{ inputs.mode || 'golden-execution' }}
          MODEL: ${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUNNER_TARGET: ${{ inputs.runner_target || 'github-hosted' }}
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          bash scripts/ai/include-untracked-in-diff.sh
          git rev-parse "$BASELINE_SHA" > agent-evidence/baseline-sha.txt
          git diff --name-status "$BASELINE_SHA" > agent-evidence/changed-files-manifest.txt
          printf 'task=%s\nmode=%s\nmodel=%s\nevent=%s\nrunner_target=%s\n' "$TASK_ID" "$MODE" "$MODEL" "$TRIGGER_EVENT" "$RUNNER_TARGET" > agent-evidence/run-context.txt
          cp agent-execution-report.md agent-evidence/model-execution-report.md
          cp agent-execution-notes.md agent-evidence/agent-execution-notes.md
          git diff --check > agent-evidence/diff-check.txt
          git diff --binary "$BASELINE_SHA" > agent-evidence/repository-diff.patch

      - name: Final secret scan (tracked, untracked, and generated evidence)
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/ai/include-untracked-in-diff.sh
          python3 scripts/ai/scan-candidate-secrets.py "$BASELINE_SHA"

      - name: Revalidate fresh branch head before publishing
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "STALE_CANDIDATE: autonomous execution is branch-bound." >&2
            exit 1
          fi
          current_branch_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$current_branch_sha" || "$current_branch_sha" != "$EXPECTED_SHA" ]]; then
            echo "STALE_CANDIDATE: remote branch HEAD=${current_branch_sha:-MISSING} expected=$EXPECTED_SHA" >&2
            exit 1
          fi
          echo "CURRENT_BRANCH_HEAD_SHA=$current_branch_sha"

      - name: Commit autonomous result on isolated branch
        id: commit
        run: |
          set -euo pipefail
          branch="ai/auto/${TASK_ID,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "AFAGHX Chief Engineering Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "AI: execute $TASK_ID autonomous engineering task"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push isolated branch
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

      - name: Create governed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-LOCAL-001' }}
        run: |
          set -euo pipefail
          gh pr create             --base main             --head "$BRANCH"             --title "AI: $TASK_ID — Local Golden Execution result"             --body-file agent-evidence/model-execution-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-agent-local-evidence-${{ github.run_id }}
          path: |
            agent-evidence/
            changed-files.txt
          if-no-files-found: error

  final-gate:
    name: Agent Final Gate
    needs: [preflight, autonomous-execution]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AFX-GOLDEN-EXECUTE]'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce final truth state
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          EXECUTION: ${{ needs.autonomous-execution.result }}
        run: |
          set -euo pipefail
          echo "preflight=$PREFLIGHT"
          echo "execution=$EXECUTION"
          test "$PREFLIGHT" = success
          test "$EXECUTION" = success
          echo "AFX-AI-CEA-001 TASK GATE: EVIDENCE_VERIFIED"
          echo "AFAGHX system/Production PROVEN status: NOT_EVALUATED_BY_THIS_TASK_WORKFLOW"
