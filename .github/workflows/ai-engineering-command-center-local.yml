name: AFAGHX Autonomous Engineering Agent — Local-First

# PRIMARY AGENT PATH: local Ollama + OpenCode. No paid API is required.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent operating mode
        required: true
        type: choice
        options: [golden-execution]
        default: golden-execution
      task:
        description: Governed task ID
        required: true
        type: string
        default: AFX-GOLDEN-LOCAL-001
      model:
        description: Local Ollama model in provider/model form
        required: true
        type: string
        default: ollama/qwen2.5-coder:14b

concurrency:
  group: afaghx-autonomous-engineering-agent-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Agent Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Validate local-first control plane
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/providers.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/agent-loop.py
          test -f .ai/runtime/forensics.py
          test -f .ai/runtime/golden-execution.contract.test.mjs
          test -f .opencode/agents/afaghx-engineer.md
          test -f opencode.json
          test -f scripts/ai/local-agent-preflight.sh
          test -f scripts/ai/run-local-agent.sh
          test -f scripts/ai/include-untracked-in-diff.sh
          test -f scripts/ai/scan-candidate-secrets.py
          python3 -m json.tool .ai/tasks/queue.json >/dev/null
          python3 -m json.tool opencode.json >/dev/null
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

      - name: Validate requested task
        env:
          TASK_ID: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" <<'PY'
          import json, sys
          q=json.load(open('.ai/tasks/queue.json'))
          task=next((x for x in q.get('tasks', []) if x.get('id') == sys.argv[1]), None)
          if not task:
              raise SystemExit(f"Unknown task: {sys.argv[1]}")
          if task.get('status') != 'READY':
              raise SystemExit(f"Task is not READY: {sys.argv[1]}")
          PY

  autonomous-execution:
    name: Local Golden Execution / Autonomous Engineering
    needs: preflight
    runs-on: [self-hosted, linux, x64, afaghx-ai]
    environment: afaghx-ai-execute
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
      TASK_ID: ${{ inputs.task }}
      MODE: ${{ inputs.mode }}
      AFAGHX_LOCAL_MODEL: ${{ inputs.model }}
      OLLAMA_URL: http://127.0.0.1:11434
      OPENCODE_CLI_VERSION: '2.0.28'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Capture immutable baseline
        id: baseline
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ensure pinned OpenCode CLI v2 is available
        run: |
          set -euo pipefail
          expected="${OPENCODE_CLI_VERSION}"
          installed="$(opencode --version 2>/dev/null || true)"
          if [[ "$installed" != *"$expected"* ]]; then
            npm install -g "@opencode/cli@${OPENCODE_CLI_VERSION}" --no-audit --no-fund
          fi
          actual="$(opencode --version 2>&1 | tr -d '\r')"
          if [[ "$actual" != *"$expected"* ]]; then
            echo "opencode_version_mismatch expected=$expected actual=$actual" >&2
            exit 1
          fi
          echo "opencode_version=$actual"

      - name: Verify local AI runtime
        run: |
          set -euo pipefail
          model="${AFAGHX_LOCAL_MODEL#ollama/}"
          AFAGHX_LOCAL_MODEL="$model" OLLAMA_URL="$OLLAMA_URL" bash scripts/ai/local-agent-preflight.sh

      - name: Execute governed local Agent
        run: |
          set -euo pipefail
          bash scripts/ai/run-local-agent.sh

      - name: Enforce immutable git baseline
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          git diff --check

      - name: Enforce protected boundaries and substantive change
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          TASK_ID: ${{ inputs.task }}
        run: |
          set -euo pipefail
          bash scripts/ai/include-untracked-in-diff.sh
          changed="$(git diff --name-only "$BASELINE_SHA" | sort -u)"
          test -n "$changed"
          printf '%s\n' "$changed" > changed-files.txt
          if printf '%s\n' "$changed" | grep -Eq '^(AGENTS\.md|\.ai/policies/)'; then
            echo "Protected governance files modified." >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'; then
            echo "Secret-like file modification detected." >&2
            exit 1
          fi
          substantive="$(printf '%s\n' "$changed" | grep -Ev '^(agent-execution-notes\.md|agent-execution-prompt\.md|changed-files\.txt|agent-execution-report\.md)$' || true)"
          test -n "$substantive"
          python3 - "$TASK_ID" "$changed" <<'PY'
          import json, sys
          task_id, changed = sys.argv[1], sys.argv[2].splitlines()
          q=json.load(open('.ai/tasks/queue.json'))
          task=next((x for x in q.get('tasks', []) if x.get('id') == task_id), None)
          if not task:
              raise SystemExit(f"Unknown task: {task_id}")
          required=set(task.get('required_change_paths', []))
          missing=sorted(required - set(changed))
          if missing:
              raise SystemExit(f"Required task paths not changed: {missing}")
          generated={
              'agent-execution-notes.md',
              'agent-execution-prompt.md',
              'agent-execution-report.md',
              'changed-files.txt',
          }
          unexpected=sorted(set(changed) - required - generated)
          if unexpected:
              raise SystemExit(f"Out-of-scope paths changed: {unexpected}")
          PY

      - name: Run forensic baseline evidence
        run: python3 .ai/runtime/forensics.py

      - name: Syntax-check agent-authored provider contract without executing it
        if: ${{ inputs.mode == 'golden-execution' }}
        run: node --check .ai/runtime/local-provider.contract.test.mjs

      - name: Validate provider contract source and live configuration without executing candidate code
        run: node scripts/ai/validate-local-provider-contract.mjs

      - name: Run Golden Execution governance contract
        run: node --test .ai/runtime/golden-execution.contract.test.mjs

      - name: Run canonical Core runtime
        run: node --test platform/Gateway/runtime.integration.test.mjs

      - name: Run AFX-CORE security suite
        working-directory: core/AFX-CORE
        run: npm run test:security

      - name: Run deterministic Task/Gate/Evidence loop
        env:
          AFX_TASK_ID: ${{ inputs.task }}
        run: python3 .ai/runtime/agent-loop.py

      - name: Verify task is DONE
        env:
          TASK_ID: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" <<'PY'
          import json, sys
          with open('agent-evidence/task-loop.json', encoding='utf-8') as f:
              evidence=json.load(f)
          if evidence.get('task_id') != sys.argv[1]:
              raise SystemExit('Task evidence ID mismatch.')
          if evidence.get('status') != 'VERIFY_SUCCESS':
              raise SystemExit('Task verification did not succeed.')
          if evidence.get('truth_state') != 'TESTED':
              raise SystemExit('Task evidence must report TESTED, not PROVEN.')
          if evidence.get('verification_state') != 'GREEN':
              raise SystemExit('Task verification state is not GREEN.')
          PY

      - name: Secret diff scan
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/ai/include-untracked-in-diff.sh
          python3 scripts/ai/scan-candidate-secrets.py "$BASELINE_SHA"

      - name: Build machine evidence
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          : > agent-evidence/baseline-sha.txt
          : > agent-evidence/changed-files-manifest.txt
          : > agent-evidence/run-context.txt
          : > agent-evidence/model-execution-report.md
          : > agent-evidence/agent-execution-notes.md
          : > agent-evidence/diff-check.txt
          : > agent-evidence/repository-diff.patch
          bash scripts/ai/include-untracked-in-diff.sh
          git rev-parse "$BASELINE_SHA" > agent-evidence/baseline-sha.txt
          git diff --name-status "$BASELINE_SHA" > agent-evidence/changed-files-manifest.txt
          printf 'task=%s\nmode=%s\nmodel=%s\nevent=%s\n' "${{ inputs.task }}" "${{ inputs.mode }}" "${{ inputs.model }}" "${{ github.event_name }}" > agent-evidence/run-context.txt
          cp agent-execution-report.md agent-evidence/model-execution-report.md
          cp agent-execution-notes.md agent-evidence/agent-execution-notes.md
          git diff --check > agent-evidence/diff-check.txt
          git diff --binary "$BASELINE_SHA" > agent-evidence/repository-diff.patch

      - name: Final Secret Scan (tracked and untracked)
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/ai/include-untracked-in-diff.sh
          python3 scripts/ai/scan-candidate-secrets.py "$BASELINE_SHA"

      - name: Commit autonomous result on isolated branch
        id: commit
        run: |
          set -euo pipefail
          branch="ai/auto/${TASK_ID,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "AFAGHX Chief Engineering Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "AI: execute $TASK_ID autonomous engineering task"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push isolated branch
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

      - name: Create governed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TASK_ID: ${{ inputs.task }}
        run: |
          set -euo pipefail
          gh pr create             --base main             --head "$BRANCH"             --title "AI: $TASK_ID — Local Golden Execution result"             --body-file agent-evidence/model-execution-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-agent-local-evidence-${{ github.run_id }}
          path: |
            agent-evidence/
            changed-files.txt
          if-no-files-found: error

  final-gate:
    name: Agent Final Gate
    needs: [preflight, autonomous-execution]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce final truth state
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          EXECUTION: ${{ needs.autonomous-execution.result }}
        run: |
          set -euo pipefail
          echo "preflight=$PREFLIGHT"
          echo "execution=$EXECUTION"
          test "$PREFLIGHT" = success
          test "$EXECUTION" = success
          echo "candidate_gate=CANDIDATE_CREATED"
          echo "pr_checks=PR_CI_PENDING"
          echo "human_review=HUMAN_REVIEW_REQUIRED"
          echo "production_ready=false"
          echo "AFX-AI-CEA-001 FINAL GATE: CANDIDATE_CREATED; PR_CI_PENDING; HUMAN_REVIEW_REQUIRED; NOT_PRODUCTION_READY"
