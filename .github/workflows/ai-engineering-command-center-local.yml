name: AFAGHX Autonomous Engineering Agent

# LOCAL-FIRST EXECUTION: no paid API is required for the primary Agent path.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-engineering-command-center-local.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Agent operating mode
        required: true
        type: choice
        options: [plan, audit, implement, golden-execution, security, verify]
        default: golden-execution
      task:
        description: Governed task ID
        required: true
        type: string
        default: AFX-GOLDEN-001
      model:
        description: Local Ollama model in provider/model form
        required: true
        type: string
        default: ollama/qwen2.5-coder:14b
      effort:
        description: Reasoning effort
        required: true
        type: choice
        options: [low, medium, high]
        default: high

concurrency:
  group: afaghx-autonomous-engineering-agent-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Agent Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Validate local-first control plane
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/providers.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/agent-loop.py
          test -f .ai/runtime/forensics.py
          test -f .ai/runtime/golden-execution.contract.test.mjs
          test -f .opencode/agents/afaghx-engineer.md
          test -f scripts/ai/local-agent-preflight.sh
          python3 -m json.tool .ai/tasks/queue.json >/dev/null
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

      - name: Validate requested task
        env:
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" <<'PY'
          import json, sys
          q=json.load(open('.ai/tasks/queue.json'))
          task_id=sys.argv[1]
          task=next((x for x in q.get('tasks', []) if x.get('id') == task_id), None)
          if not task:
              raise SystemExit(f"Unknown task: {task_id}")
          if task.get('status') != 'READY':
              raise SystemExit(f"Task is not READY: {task_id}")
          PY

  autonomous-execution:
    name: Local Golden Execution / Autonomous Engineering
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AFX-GOLDEN-EXECUTE]')) }}
    needs: preflight
    runs-on: [self-hosted, linux, x64, afaghx-ai]
    environment: afaghx-ai-local
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
      TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
      AFAGHX_LOCAL_MODEL: ${{ inputs.model && startsWith(inputs.model, 'ollama/') && fromJSON(format('"'{0}'"', inputs.model)) || 'qwen2.5-coder:14b' }}
      OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Capture immutable baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify local AI runtime
        run: bash scripts/ai/local-agent-preflight.sh

      - name: Execute governed local Agent
        run: |
          set -euo pipefail
          MODEL="${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}"
          opencode run             --model "$MODEL"             --agent afaghx-engineer             --format default             "You are AFX-AI-CEA-001, the AFAGHX Chief Engineering Agent.

MODE: ${{ inputs.mode || 'golden-execution' }}
TASK: ${{ inputs.task || 'AFX-GOLDEN-001' }}
BASELINE: $GITHUB_SHA

GOVERNING ORDER:
MISSION -> BASELINE -> FORENSICS -> ARCHITECTURE IMPACT -> SECURITY IMPACT
-> PLAN -> IMPLEMENT -> TEST -> EVIDENCE -> GATE -> PR.

Read AGENTS.md, .ai/command-center.yaml, .ai/providers.yaml, .ai/tasks/queue.json,
.ai/runtime/*, .ai/agents/*, .ai/policies/*, .ai/architecture/*,
.ai/contracts/* and .ai/evidence/*.

Execute only the requested task in this isolated workspace.
Do not edit AGENTS.md or .ai/policies/*.
Do not modify secrets.
Do not change architecture without an ADR.
Preserve AFX-CORE as the only identity/authentication/authorization authority.
Preserve EXPERIENCE as presentation-only.
Preserve Gateway -> PersistentAfxCore -> PostgreSQL.
Never access a database directly from Experience.
Never push, merge, deploy, or create a pull request yourself.
Never create a local git commit.
Leave HEAD at BASELINE.
Run the task verification and remediate safe failures you introduced.
Never fabricate evidence or claim GREEN without evidence.

For AFX-GOLDEN-001 the required substantive change is:
.ai/runtime/golden-execution.contract.test.mjs

Write concise execution notes to:
agent-execution-notes.md
" | tee agent-execution-report.md

      - name: Enforce immutable git baseline
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          git diff --check

      - name: Enforce protected boundaries and substantive change
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASELINE_SHA")"
          test -n "$changed"
          printf '%s\n' "$changed" > changed-files.txt
          if printf '%s\n' "$changed" | grep -Eq '^(AGENTS\.md|\.ai/policies/)'; then
            echo "Protected governance files modified." >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'; then
            echo "Secret-like file modification detected." >&2
            exit 1
          fi
          substantive="$(printf '%s\n' "$changed" | grep -Ev '^(agent-execution-notes\.md|changed-files\.txt|agent-execution-report\.md)$' || true)"
          test -n "$substantive"
          python3 - "$TASK_ID" "$changed" <<'PY'
          import json, sys
          task_id, changed = sys.argv[1], sys.argv[2].splitlines()
          q=json.load(open('.ai/tasks/queue.json'))
          task=next((x for x in q.get('tasks', []) if x.get('id') == task_id), None)
          if not task:
              raise SystemExit(f"Unknown task: {task_id}")
          missing=[p for p in task.get('required_change_paths', []) if p not in changed]
          if missing:
              raise SystemExit(f"Required task paths not changed: {missing}")
          PY

      - name: Run forensic baseline evidence
        run: python3 .ai/runtime/forensics.py

      - name: Run Golden Execution contract
        if: ${{ (inputs.mode || 'golden-execution') == 'golden-execution' }}
        run: node --test .ai/runtime/golden-execution.contract.test.mjs

      - name: Run canonical Core runtime
        run: node --test platform/Gateway/runtime.integration.test.mjs

      - name: Run AFX-CORE security suite
        working-directory: core/AFX-CORE
        run: npm run test:security

      - name: Run deterministic Task/Gate/Evidence loop
        env:
          AFX_TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: python3 .ai/runtime/agent-loop.py

      - name: Verify task is DONE
        env:
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: |
          set -euo pipefail
          python3 - "$TASK_ID" <<'PY'
          import json, sys
          q=json.load(open('.ai/tasks/queue.json'))
          task=next((x for x in q.get('tasks', []) if x.get('id') == sys.argv[1]), None)
          if task is None or task.get('status') != 'DONE':
              raise SystemExit(f"Task not proven DONE: {sys.argv[1]}")
          PY

      - name: Secret diff scan
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          ! git diff --binary "$BASELINE_SHA" | grep -Eiq '(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|ghp_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,})'

      - name: Build machine evidence
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          git rev-parse "$BASELINE_SHA" > agent-evidence/baseline-sha.txt
          git diff --name-status "$BASELINE_SHA" > agent-evidence/changed-files-manifest.txt
          printf 'task=%s\nmode=%s\nmodel=%s\nevent=%s\n'             "${{ inputs.task || 'AFX-GOLDEN-001' }}" "${{ inputs.mode || 'golden-execution' }}" "${{ inputs.model || 'ollama/qwen2.5-coder:14b' }}" "${{ github.event_name }}"             > agent-evidence/run-context.txt
          cp agent-execution-report.md agent-evidence/model-execution-report.md
          cp agent-execution-notes.md agent-evidence/agent-execution-notes.md
          git diff --check > agent-evidence/diff-check.txt
          git diff --binary "$BASELINE_SHA" > agent-evidence/repository-diff.patch

      - name: Commit autonomous result on isolated branch
        id: commit
        env:
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: |
          set -euo pipefail
          branch="ai/auto/${TASK_ID,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "AFAGHX Chief Engineering Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "AI: execute $TASK_ID autonomous engineering task"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push isolated branch
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

      - name: Create governed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TASK_ID: ${{ inputs.task || 'AFX-GOLDEN-001' }}
        run: |
          set -euo pipefail
          gh pr create             --base main             --head "$BRANCH"             --title "AI: $TASK_ID — Local Golden Execution result"             --body-file agent-evidence/model-execution-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-agent-local-evidence-${{ github.run_id }}
          path: |
            agent-evidence/
            changed-files.txt
          if-no-files-found: error

  final-gate:
    name: Agent Final Gate
    needs: [preflight, autonomous-execution]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AFX-GOLDEN-EXECUTE]'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce final truth state
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          EXECUTION: ${{ needs.autonomous-execution.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          test "$EXECUTION" = success
          echo "AFX-AI-CEA-001 FINAL GATE: PROVEN"
