name: AFAGHX Storefront Experience Gate

on:
  pull_request:
    paths:
      - 'experience/storefront/**'
      - '.github/workflows/experience-storefront-gate.yml'
  push:
    branches: [main]
    paths:
      - 'experience/storefront/**'
      - '.github/workflows/experience-storefront-gate.yml'

permissions:
  contents: read

jobs:
  storefront-quality:
    name: Storefront type, contract, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience/storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run search contract tests
        run: bun test src/lib/search-client.test.ts

      - name: Run TypeScript compiler independently
        run: bunx tsc --noEmit

      - name: Run ESLint
        run: bun run lint

      - name: Build production storefront
        run: bun run build
