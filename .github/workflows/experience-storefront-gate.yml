name: AFAGHX Storefront Experience Gate

on:
  pull_request:
    paths:
      - 'experience/storefront/**'
      - '.github/workflows/experience-storefront-gate.yml'
  push:
    branches: [main]
    paths:
      - 'experience/storefront/**'
      - '.github/workflows/experience-storefront-gate.yml'

permissions:
  contents: read

jobs:
  storefront-quality:
    name: Storefront type, contract, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience/storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Node for browser smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run search contract tests
        run: bun test src/lib/search-client.test.ts

      - name: Run TypeScript compiler independently
        run: bunx tsc --noEmit

      - name: Run ESLint
        run: bun run lint

      - name: Build production storefront
        run: bun run build

      - name: Install Chromium for visual review
        run: bunx playwright install --with-deps chromium

      - name: Start production server
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 bun .next/standalone/server.js > /tmp/afx-storefront.log 2>&1 &
          echo $! > /tmp/afx-storefront.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/afx-storefront.log
          exit 1

      - name: Smoke-test canonical homepage destinations
        run: |
          for path in / /products /suppliers /factories /services /business-network /markets /intelligence; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 "http://127.0.0.1:3000${path}")
            case "$status" in
              200|301|302|307|308) echo "PASS $path ($status)" ;;
              *) echo "FAIL $path ($status)"; exit 1 ;;
            esac
          done

      - name: Run responsive, locale and interaction browser checks
        run: |
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          test -n "$CHROMIUM_PATH"
          CHROMIUM_PATH="$CHROMIUM_PATH" AFX_BASE_URL="http://127.0.0.1:3000/" node ops/homepage-browser-smoke.mjs

      - name: Capture desktop, tablet and mobile homepage screenshots
        run: |
          mkdir -p artifacts/design-review
          bunx playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page --wait-for-timeout 1200 http://127.0.0.1:3000/ artifacts/design-review/home-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1024,768" --full-page --wait-for-timeout 1200 http://127.0.0.1:3000/ artifacts/design-review/home-tablet-landscape.png
          bunx playwright screenshot --browser chromium --viewport-size "768,1024" --full-page --wait-for-timeout 1200 http://127.0.0.1:3000/ artifacts/design-review/home-tablet-portrait.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 1200 http://127.0.0.1:3000/ artifacts/design-review/home-mobile.png

      - name: Upload visual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-homepage-visual-review-${{ github.sha }}
          path: experience/storefront/artifacts/design-review/
          if-no-files-found: error
          retention-days: 14
