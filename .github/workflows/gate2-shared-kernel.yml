name: AFAGHX Gate 2 Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-kernel-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install verification toolchain
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts             typescript@5.7.0 tsx@4.19.0 c8@10.1.3             eslint@9.17.0 @typescript-eslint/parser@8.18.0             dependency-cruiser@16.10.4

      - name: Verify canonical DomainEvent ownership
        run: |
          set -euo pipefail
          test -f packages/contracts/src/events.ts
          test ! -e packages/shared-kernel/src/domain-event.ts
          ! grep -RInE 'export (interface|type|class|function) (DomainEvent|EventMetadata|createDomainEvent)' packages/shared-kernel/src
          ! grep -RInE 'domain-event|createDomainEvent' packages/shared-kernel/src/index.ts

      - name: Typecheck
        run: |
          set -euo pipefail
          npx tsc -p packages/shared-kernel/tsconfig.json --noEmit

      - name: Lint
        run: |
          set -euo pipefail
          cat > /tmp/eslint.config.mjs <<'EOF'
          import tsParser from "@typescript-eslint/parser";
          export default [{
            files: ["**/*.ts"],
            languageOptions: { parser: tsParser, parserOptions: { ecmaVersion: "latest", sourceType: "module" } },
            rules: { "no-undef": "error", "no-unused-vars": "off" }
          }];
          EOF
          npx eslint --config /tmp/eslint.config.mjs packages/shared-kernel/src packages/shared-kernel/test

      - name: Test with coverage
        run: |
          set -euo pipefail
          rm -rf coverage
          npx c8 --check-coverage --lines 95 --functions 95 --branches 95 --statements 95             --reporter=text-summary             npx tsx --test packages/shared-kernel/test/shared-kernel.test.ts

      - name: Build
        run: |
          set -euo pipefail
          npx tsc -p packages/shared-kernel/tsconfig.json

      - name: Dependency graph boundary proof
        run: |
          set -euo pipefail
          cat > /tmp/dependency-cruiser.cjs <<'EOF'
          module.exports = {
            forbidden: [
              { name: "shared-kernel-to-core-runtime", severity: "error", from: { path: "^packages/shared-kernel" }, to: { path: "^packages/core-runtime" } },
              { name: "shared-kernel-to-tenant", severity: "error", from: { path: "^packages/shared-kernel" }, to: { path: "^packages/tenant" } },
              { name: "shared-kernel-to-rbac", severity: "error", from: { path: "^packages/shared-kernel" }, to: { path: "^packages/rbac" } },
              { name: "shared-kernel-to-policy", severity: "error", from: { path: "^packages/shared-kernel" }, to: { path: "^packages/policy" } }
            ]
          };
          EOF
          npx depcruise --config /tmp/dependency-cruiser.cjs packages/shared-kernel/src
