name: AFAGHX AI Provider & Mission Runtime CI

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Governed provider operation
        required: true
        type: choice
        options: [plan, implement, review, summarize_evidence]
        default: plan
      task:
        description: Mission task
        required: true
        type: string
        default: MISSION-001 offline provider validation
  pull_request:
    paths:
      - '.ai/providers.yaml'
      - '.ai/providers/provider-contract.yaml'
      - 'intelligence/ai_gateway/**'
      - 'intelligence/mission/**'
      - 'intelligence/agents/**'
      - 'tests/intelligence/**'
      - 'docs/ai-command-center/MISSION-001-OFFLINE.md'
      - 'docs/ai-command-center/MISSION-002-*.md'
      - '.github/workflows/mission-001-offline.yml'

permissions:
  contents: read

jobs:
  mission-001-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Baseline integrity
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/providers.yaml
          test -f .ai/providers/provider-contract.yaml
          test -f intelligence/ai_gateway/provider.py
          test -f intelligence/ai_gateway/gateway.py
          test -f tests/intelligence/test_mock_provider.py
          git diff --check

      - name: Run provider contract tests
        run: python -m unittest discover -s tests/intelligence -p 'test_*.py' -v

      - name: Execute MISSION-001 offline through gateway
        env:
          OPERATION: ${{ inputs.operation || 'plan' }}
          TASK: ${{ inputs.task || 'MISSION-001 offline provider validation' }}
          RUN_ID: mission-001-${{ github.run_id }}
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/mission-001
          python - <<'PY'
          import json
          import os
          from intelligence.ai_gateway.gateway import AIGateway, ProviderPolicy
          from intelligence.ai_gateway.provider import MockProvider, ProviderRequest

          provider = MockProvider()
          gateway = AIGateway(
              providers={"mock": provider},
              policies={
                  "mock": ProviderPolicy(
                      allowed_modes=frozenset({"plan", "audit"}),
                      network_access=False,
                      api_credits_required=False,
                  )
              },
          )
          response = gateway.run(
              provider_name="mock",
              mode="plan",
              request=ProviderRequest(
                  operation=os.environ["OPERATION"],
                  prompt=os.environ["TASK"],
                  run_id=os.environ["RUN_ID"],
              ),
          )
          evidence = {
              "mission": "MISSION-001",
              "mission_version": "1",
              "provider": response.provider,
              "provider_version": response.model,
              "operation": os.environ["OPERATION"],
              "model": response.model,
              "run_id": response.run_id,
              "workflow_run_id": os.environ["RUN_ID"],
              "git_sha": os.environ["GIT_SHA"],
              "input_hash": response.input_hash,
              "output_hash": response.output_hash,
              "started_at": response.started_at,
              "finished_at": response.finished_at,
              "duration_ms": response.duration_ms,
              "status": response.status,
              "network_access": False,
              "api_credits_required": False,
              "output": response.output,
          }
          with open("evidence/mission-001/provider-result.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
          assert response.status == "success"
          assert response.provider == "mock"
          assert response.output_hash
          PY

      - name: Evidence assertions
        run: |
          set -euo pipefail
          test -s evidence/mission-001/provider-result.json
          python - <<'PY'
          import json
          with open("evidence/mission-001/provider-result.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["mission"] == "MISSION-001"
          assert data["mission_version"] == "1"
          assert data["provider"] == "mock"
          assert data["operation"] in {"plan", "implement", "review", "summarize_evidence"}
          assert data["status"] == "success"
          assert data["git_sha"]
          assert data["started_at"].endswith("+00:00")
          assert data["finished_at"].endswith("+00:00")
          assert isinstance(data["duration_ms"], int)
          assert data["network_access"] is False
          assert data["api_credits_required"] is False
          PY

      - name: Upload MISSION-001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mission-001-offline-evidence-${{ github.run_id }}
          path: evidence/mission-001/
          if-no-files-found: error

  mission-002-offline-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Mission Engine through governed gateway
        run: |
          set -euo pipefail
          python -m unittest tests.intelligence.test_mission_engine -v

      - name: Validate OpenAI adapter without network or secret
        run: |
          set -euo pipefail
          python -m unittest tests.intelligence.test_openai_provider -v

      - name: Validate runtime wiring without invoking OpenAI
        run: |
          set -euo pipefail
          python -m unittest tests.intelligence.test_runtime_wiring -v

      - name: Validate agent registry and mission evidence contract
        run: |
          set -euo pipefail
          test -f intelligence/agents/registry.yaml
          test -f docs/ai-command-center/MISSION-002-ACCEPTANCE.md
          grep -q 'agent_cannot_merge: true' intelligence/agents/registry.yaml
          grep -q 'human_review_required_before_merge: true' intelligence/agents/registry.yaml
          grep -q 'OPENAI_API_KEY' intelligence/ai_gateway/openai_provider.py
          ! grep -RInE 'OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*["'"'][^$]' intelligence tests docs .ai 2>/dev/null

      - name: Upload MISSION-002 offline evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/mission-002
          cat > evidence/mission-002/offline-ci.json <<'JSON'
          {
            "mission": "MISSION-002",
            "mode": "offline",
            "provider_boundary": "openai-codex",
            "network_access": false,
            "api_credits_required": false,
            "live_openai_execution": false,
            "status": "success"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: mission-002-offline-evidence-${{ github.run_id }}
          path: evidence/mission-002/
          if-no-files-found: error
