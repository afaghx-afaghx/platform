name: Gate 01 Concurrency
on:
  pull_request:
    paths:
      - 'core/AFX-CORE/**'
      - '.github/workflows/gate-01-concurrency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-01-concurrency:
    name: gate-01-concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: afxcore, POSTGRES_PASSWORD: afxcore, POSTGRES_DB: afxcore_gate01 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afxcore -d afxcore_gate01"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://afxcore:afxcore@127.0.0.1:5432/afxcore_gate01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: core/AFX-CORE/package-lock.json }
      - name: Install
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Concurrency evidence
        working-directory: core/AFX-CORE
        run: node --test test/persistence.test.js
