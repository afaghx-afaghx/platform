name: AFX-CORE Security

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/AFX-CORE/**'
      - 'docs/security/**'
      - '.github/workflows/afx-core-security.yml'
  pull_request:
    paths:
      - 'core/AFX-CORE/**'
      - 'docs/security/**'
      - '.github/workflows/afx-core-security.yml'

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afxcore
          POSTGRES_PASSWORD: afxcore
          POSTGRES_DB: afxcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afxcore -d afxcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install locked dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        working-directory: core/AFX-CORE
        run: npm ls --all
      - name: Run AFX-CORE bootstrap security tests
        working-directory: core/AFX-CORE
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee ../../artifacts-security-bootstrap.txt
      - name: Run AFX-CORE password hashing calibration
        working-directory: core/AFX-CORE
        run: |
          set -o pipefail
          npm run test:calibration 2>&1 | tee ../../artifacts-password-hashing-calibration.txt
      - name: Run AFX-CORE PostgreSQL persistence and refresh race tests
        working-directory: core/AFX-CORE
        env:
          DATABASE_URL: postgresql://afxcore:afxcore@localhost:5432/afxcore_test
        run: |
          set -o pipefail
          npm run test:persistence 2>&1 | tee ../../artifacts-security-persistence.txt
      - name: Run G01-15 WebAuthn policy and lifecycle tests
        working-directory: core/AFX-CORE
        run: |
          set -o pipefail
          npm run test:g01-15 2>&1 | tee ../../artifacts-security-g01-15.txt
      - name: Install Playwright for G01-15 browser evidence
        working-directory: core/AFX-CORE/test/browser
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium for G01-15 browser evidence
        working-directory: core/AFX-CORE/test/browser
        run: npx playwright install --with-deps chromium
      - name: Run G01-15 real Chromium evidence
        working-directory: core/AFX-CORE/test/browser
        run: |
          set -o pipefail
          node g01-15-browser.test.mjs 2>&1 | tee ../../../artifacts-security-g01-15-browser.txt
      - name: Capture PostgreSQL evidence
        if: always()
        env:
          PGPASSWORD: afxcore
        run: |
          mkdir -p artifacts/afx-core-security
          pg_isready -h localhost -p 5432 -U afxcore -d afxcore_test | tee artifacts/afx-core-security/postgres-health.txt
          psql -h localhost -p 5432 -U afxcore -d afxcore_test -c 'SELECT version();' | tee artifacts/afx-core-security/postgres-version.txt
          psql -h localhost -p 5432 -U afxcore -d afxcore_test -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'afx_%' ORDER BY table_name;" | tee artifacts/afx-core-security/schema-tables.txt
      - name: Assemble security evidence artifact
        if: always()
        run: |
          mkdir -p artifacts/afx-core-security
          cp artifacts-security-bootstrap.txt artifacts/afx-core-security/ 2>/dev/null || true
          cp artifacts-password-hashing-calibration.txt artifacts/afx-core-security/ 2>/dev/null || true
          cp artifacts-security-persistence.txt artifacts/afx-core-security/ 2>/dev/null || true
          cp artifacts-security-g01-15.txt artifacts/afx-core-security/ 2>/dev/null || true
          cp artifacts-security-g01-15-browser.txt artifacts/afx-core-security/ 2>/dev/null || true
          {
            echo '# AFX-CORE Security CI Evidence'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Node: $(node --version 2>/dev/null || true)"
            echo
            echo 'Controls exercised:'
            echo '- Deterministic npm dependency installation via package-lock.json + npm ci'
            echo '- Production password hashing calibration (scrypt N=2^15, r=8, p=3)'
            echo '- PostgreSQL 16 service health and schema evidence'
            echo '- Durable PostgreSQL-backed identity/membership/session persistence'
            echo '- Transactional refresh-token rotation'
            echo '- Concurrent refresh race: exactly one winner'
            echo '- G01-15 WebAuthn RP-ID/origin policy and deterministic lifecycle tests'
            echo '- G01-15 real Chromium virtual-authenticator registration/authentication evidence'
          } > artifacts/afx-core-security/README.md
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afx-core-security-evidence-${{ github.run_id }}
          path: artifacts/afx-core-security
