name: AFX-CORE Security

on:
  push:
    paths:
      - 'core/AFX-CORE/**'
      - 'docs/security/**'
      - '.github/workflows/afx-core-security.yml'
  pull_request:
    paths:
      - 'core/AFX-CORE/**'
      - 'docs/security/**'
      - '.github/workflows/afx-core-security.yml'

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run AFX-CORE security tests
        working-directory: core/AFX-CORE
        run: npm test
