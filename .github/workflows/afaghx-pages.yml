name: AFAGHX Pages

on:
  push:
    branches: [deploy/experience-prototype]
    paths:
      - 'experience/web/public/**'
      - 'experience/web/test/**'
      - 'experience/web/package.json'
      - '.github/workflows/afaghx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-experience-homepage
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Experience boundary tests
        run: npm --prefix experience/web test
      - name: Apply canonical Homepage typography and headline
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experience/web/public/index.html')
          text = path.read_text(encoding='utf-8')

          override = '''
    /* Canonical AFAGHX Homepage Hero typography */
    .afx-hero h1 { font-size: 40px !important; line-height: 1.12 !important; letter-spacing: -0.035em !important; }
    .afx-hero h1 span { color: inherit !important; }
    @media (max-width: 600px) { .afx-hero h1 { font-size: 32px !important; } }
    /* Persian commodity exchange title */
    html[lang="fa"] .market-section .eyebrow { font-size: 40px !important; line-height: 1.2 !important; }
'''
          marker = '  </style>'
          if 'Canonical AFAGHX Homepage Hero typography' not in text:
              text = text.replace(marker, override + marker, 1)

          # Canonical Persian headline. Do not overwrite it with an alternate brand title.
          text = text.replace(
              "'hero.title': 'سامانه آفاق |<br><span>اکوسیستم هوشمند کسب‌وکار و تجارت</span>',",
              "'hero.title': 'یک اکوسیستم.<br><span>کسب‌وکارهای متصل.</span><br>تجارت واقعی.',"
          )
          text = text.replace(
              '<h1 data-brand-i18n="hero.title">سامانه آفاق |<br><span>اکوسیستم هوشمند کسب‌وکار و تجارت</span></h1>',
              '<h1 data-brand-i18n="hero.title">یک اکوسیستم.<br><span>کسب‌وکارهای متصل.</span><br>تجارت واقعی.</h1>'
          )
          text = text.replace(
              "'hero.title': 'AFAGHX |<br><span>Intelligent Business &amp; Trade Ecosystem</span>',",
              "'hero.title': 'یک اکوسیستم.<br><span>کسب‌وکارهای متصل.</span><br>تجارت واقعی.',"
          )
          text = text.replace(
              '<h1 data-brand-i18n="hero.title">AFAGHX |<br><span>Intelligent Business &amp; Trade Ecosystem</span></h1>',
              '<h1 data-brand-i18n="hero.title">یک اکوسیستم.<br><span>کسب‌وکارهای متصل.</span><br>تجارت واقعی.</h1>'
          )

          script = '<script src="./home-v3.js" defer></script>'
          if script not in text:
              text = text.replace('</body>', f'{script}\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -n "یک اکوسیستم\|afx-hero h1\|home-v3.js" experience/web/public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experience/web/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
