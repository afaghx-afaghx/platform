name: AFAGHX Pages

on:
  push:
    branches: [deploy/experience-prototype]
    paths:
      - 'experience/web/public/**'
      - 'experience/web/test/**'
      - 'experience/web/package.json'
      - '.github/workflows/afaghx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-experience-homepage
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Experience boundary tests
        run: npm --prefix experience/web test
      - name: Apply Homepage typography override
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experience/web/public/index.html')
          text = path.read_text(encoding='utf-8')
          override = '''\n    /* Homepage Hero typography override */\n    .hero h1 { font-size: clamp(30px, 5vw, 50px) !important; line-height: 1.08 !important; }\n    @media (max-width: 560px) { .hero h1 { font-size: 30px !important; } }\n    /* Persian commodity exchange title */\n    html[lang="fa"] .market-section .eyebrow { font-size: 30px !important; line-height: 1.2 !important; }\n'''
          marker = '  </style>'
          if 'Homepage Hero typography override' not in text:
              text = text.replace(marker, override + marker, 1)
          elif 'Persian commodity exchange title' not in text:
              text = text.replace('  </style>', '    /* Persian commodity exchange title */\n    html[lang="fa"] .market-section .eyebrow { font-size: 30px !important; line-height: 1.2 !important; }\n  </style>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experience/web/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
