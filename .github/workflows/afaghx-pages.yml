name: AFAGHX Pages

on:
  push:
    branches:
      - deploy/experience-prototype
    paths:
      - 'experience/web/public/**'
      - 'experience/web/test/**'
      - 'experience/web/server.js'
      - 'experience/web/package.json'
      - '.github/workflows/afaghx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-experience-homepage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Experience boundary tests
        run: npm --prefix experience/web test

      - name: Validate Pages payload
        run: |
          test -f experience/web/public/index.html
          test -f experience/web/public/styles.css
          test -f experience/web/public/home-v3.js
          test -f experience/web/public/customer.html
          test -f experience/web/public/business.html
          test -f experience/web/public/supplier.html
          test -f experience/web/public/factory.html
          test -f experience/web/public/partner.html
          grep -q 'AFAGHX' experience/web/public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experience/web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4