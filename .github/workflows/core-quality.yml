name: core-quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/identity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile --ignore-workspace
      - run: pnpm typecheck
      - run: pnpm test

  persistence-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/persistence-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
