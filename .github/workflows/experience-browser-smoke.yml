name: AFAGHX Experience Browser Smoke

on:
  pull_request:
    paths:
      - 'experience/web/public/**'
      - 'experience/web/server.js'
      - 'experience/web/test/**'
      - '.github/workflows/experience-browser-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'experience/web/public/**'
      - 'experience/web/server.js'
      - 'experience/web/test/**'
      - '.github/workflows/experience-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm --prefix experience/web install --no-save playwright
          npx --prefix experience/web playwright install --with-deps chromium
      - name: Run unit regression suite
        run: npm --prefix experience/web test
      - name: Start Experience static server
        run: |
          PORT=3000 HOST=127.0.0.1 node experience/web/server.js > /tmp/afaghx-experience.log 2>&1 &
          echo $! > /tmp/afaghx-experience.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/afaghx-experience.log
          exit 1
      - name: Verify location dock and language navigation in Chromium
        run: node experience/web/test/browser-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-browser-smoke-evidence
          path: |
            experience/web/test-artifacts/
            /tmp/afaghx-experience.log
          if-no-files-found: warn
          retention-days: 14
