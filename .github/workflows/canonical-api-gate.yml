name: Canonical API Gate

on:
  push:
    branches:
      - remediation/canonical-api-search-location
  pull_request:
    paths:
      - 'platform/Gateway/**'
      - 'core/AFX-CORE/**'
      - '.github/workflows/canonical-api-gate.yml'

permissions:
  contents: read

jobs:
  canonical-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx_ci
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afaghx -d afaghx_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx_ci@localhost:5432/afaghx_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Gateway dependencies
        working-directory: platform/Gateway
        run: npm install --no-audit --no-fund
      - name: Install AFX-CORE dependencies
        working-directory: core/AFX-CORE
        run: npm install --no-audit --no-fund
      - name: Gateway contract tests
        working-directory: platform/Gateway
        run: npm test
      - name: AFX-CORE unit and PostgreSQL E2E tests
        working-directory: core/AFX-CORE
        run: npm test
