name: AFX-PLATFORM Security Boundary

on:
  push:
    paths:
      - 'platform/Gateway/**'
      - 'platform/API/**'
      - '.github/workflows/afx-platform-security.yml'
  pull_request:
    paths:
      - 'platform/Gateway/**'
      - 'platform/API/**'
      - '.github/workflows/afx-platform-security.yml'

permissions:
  contents: read

jobs:
  gateway-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AFX-CORE runtime dependency
        working-directory: core/AFX-CORE
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run gateway security tests
        run: node --test platform/Gateway/security-boundary.test.js
      - name: Run canonical runtime integration proof
        run: node --test platform/Gateway/runtime.integration.test.mjs
      - name: Capture security evidence
        if: always()
        run: |
          mkdir -p artifacts/afx-platform-security
          {
            echo '# AFX-PLATFORM Security Boundary Evidence'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Node: $(node --version)"
            echo
            echo 'Controls exercised:'
            echo '- Strict origin allow-list / CORS denial'
            echo '- Security response headers'
            echo '- Request correlation ID'
            echo '- Payload size enforcement'
            echo '- Per-client rate limiting'
            echo '- Bearer authentication boundary'
            echo '- Tenant-bound authorization and deny-by-default permission checks'
          } > artifacts/afx-platform-security/README.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afx-platform-security-evidence-${{ github.run_id }}
          path: artifacts/afx-platform-security
