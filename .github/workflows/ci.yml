name: AFX-CORE CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx_ci_password
          POSTGRES_DB: afaghx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://afaghx:afaghx_ci_password@localhost:5432/afaghx?schema=public
      AUTH_ISSUER: https://auth.afaghx.test
      AUTH_AUDIENCE: afaghx-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Dependency audit
        run: npm audit --audit-level=high
