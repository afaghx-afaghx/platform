name: AFX-CORE Password Calibration

on:
  pull_request:
    paths:
      - 'core/AFX-CORE/src/security.js'
      - 'core/AFX-CORE/test/password-calibration.test.js'
      - 'core/AFX-CORE/package.json'
      - 'docs/security/AFX-CORE-PASSWORD-CALIBRATION.md'
  push:
    branches: [main]
    paths:
      - 'core/AFX-CORE/src/security.js'
      - 'core/AFX-CORE/test/password-calibration.test.js'
      - 'core/AFX-CORE/package.json'
      - 'docs/security/AFX-CORE-PASSWORD-CALIBRATION.md'

permissions:
  contents: read

jobs:
  password-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Run calibration
        working-directory: core/AFX-CORE
        run: |
          mkdir -p ../../artifacts/afx-core-calibration
          npm run test:password-calibration 2>&1 | tee ../../artifacts/afx-core-calibration/password-calibration.txt
      - name: Record calibration metadata
        run: |
          mkdir -p artifacts/afx-core-calibration
          {
            echo '# AFX-CORE Password Calibration Evidence'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Node: $(node --version)"
          } > artifacts/afx-core-calibration/README.md
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: afx-core-password-calibration-${{ github.run_id }}
          path: artifacts/afx-core-calibration