name: AFX-CORE Password Calibration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/AFX-CORE/src/security.js'
      - 'core/AFX-CORE/test/password-calibration.test.js'
      - 'core/AFX-CORE/package.json'
      - 'docs/security/AFX-CORE-PASSWORD-CALIBRATION.md'
      - '.github/workflows/afx-core-password-calibration.yml'
  push:
    branches: [main]
    paths:
      - 'core/AFX-CORE/src/security.js'
      - 'core/AFX-CORE/test/password-calibration.test.js'
      - 'core/AFX-CORE/package.json'
      - 'docs/security/AFX-CORE-PASSWORD-CALIBRATION.md'
      - '.github/workflows/afx-core-password-calibration.yml'

permissions:
  contents: read

jobs:
  password-calibration:
    name: password-calibration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install locked dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Run G01-13 calibration
        working-directory: core/AFX-CORE
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/afx-core-calibration
          npm run test:password-calibration 2>&1 | tee ../../artifacts/afx-core-calibration/password-calibration.txt
      - name: Record calibration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/afx-core-calibration
          {
            echo '# AFX-CORE G01-13 Password Calibration Evidence'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Node: $(node --version)"
          } > artifacts/afx-core-calibration/README.md
          sha256sum artifacts/afx-core-calibration/* | sort > artifacts/afx-core-calibration/SHA256SUMS.txt
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: afx-g01-13-password-calibration-${{ github.run_id }}
          path: artifacts/afx-core-calibration/
          if-no-files-found: error
          retention-days: 90
