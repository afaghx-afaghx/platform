name: AFAGHX Repair Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  core-and-gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afaghx
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d afaghx"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afaghx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: core/AFX-CORE/package-lock.json}
      - run: npm ci
        working-directory: core/AFX-CORE
      - run: npm test
        working-directory: core/AFX-CORE
      - run: node --test platform/Gateway/test/security-boundary.test.mjs platform/Gateway/test/postgres-rate-limit.test.mjs platform/Gateway/test/canonical-runtime.test.mjs
