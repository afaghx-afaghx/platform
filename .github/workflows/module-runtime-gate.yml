name: AFAGHX Module-to-Runtime Matrix Gate

on:
  pull_request:
    branches:
      - main
      - feat/architecture-canonical-registry-v2
  workflow_dispatch:
    inputs:
      strict_runtime_proof:
        description: "Fail when any canonical Runtime URL is not reachable"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  module-runtime:
    name: Module-to-Runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Node runtime
        run: node --version
      - name: Validate canonical matrix
        run: node experience/validate-module-runtime-matrix.mjs
      - name: Validate matrix tests
        run: node --test experience/test/module-runtime-matrix.test.js
      - name: Validate Experience package
        working-directory: experience/web
        run: npm test
      - name: Evidence policy
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('experience/module-runtime-matrix.json', 'utf8'));
          if (m.modules.some(x => x.Evidence.status === 'PROVEN' && x.Runtime.observed_state !== 'PROVEN')) {
            console.error('PROVEN evidence cannot exist without PROVEN runtime state.');
            process.exit(1);
          }
          console.log('PASS: no ungrounded PROVEN claims.');
          NODE

  runtime-evidence:
    name: Runtime evidence probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Probe canonical Runtime URLs
        env:
          STRICT_RUNTIME_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_runtime_proof || 'false' }}
        run: node experience/probe-module-runtime.mjs
      - name: Upload raw runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-module-runtime-evidence
          path: experience/module-runtime-evidence/
          if-no-files-found: error
