name: AFAGHX CrewAI Local Validation

on:
  pull_request:
    paths:
      - "local_validation/**"
      - ".github/workflows/crewai-local-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crewai-local-validation
  cancel-in-progress: false

jobs:
  validate-crewai-project:
    name: CrewAI structure, runtime assembly and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: local_validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local_validation/pyproject.toml
      - name: Install CrewAI project dependencies
        id: install_deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate JSONC project and governance contract
        id: validate_project
        run: python validate_project.py
      - name: Instantiate four agents and assert validate-only truth boundaries
        id: runtime_assembly
        run: |
          mkdir -p output
          python main.py --validate-only > output/validate-only-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("output/validate-only-report.json").read_text(encoding="utf-8"))
          expected = {
              "status": "PASS",
              "truth_state": "TESTED",
              "llm_call": "NOT_RUN",
              "source_write": "NOT_ARMED_BY_VALIDATE_ONLY",
              "production_readiness": "NOT_PROVEN",
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"validate-only truth-boundary failure: {key}")
          if report.get("agents") != 4 or report.get("tasks") != 4:
              raise SystemExit("expected exactly four configured agents and tasks")
          print("PASS: structure assembled; no real model call, source write, or production claim.")
          PY
      - name: Run zero-cost security, runtime and tool-contract tests
        id: unit_tests
        run: python -m unittest discover -s tests -v
      - name: Compile runtime and custom tools
        id: compile_tools
        run: python -m compileall -q main.py governance.py validate_project.py tools tests
      - name: Assert no production provider or deployment execution in CI
        id: policy_boundary
        run: |
          python - <<'PY'
          import os
          assert "OPENAI_API_KEY" not in os.environ, "Provider credentials must not be injected into the local validation workflow."
          assert "AFAGHX_WRITE_ENABLED" not in os.environ, "CI must not arm repository source writes."
          print("PASS: no LLM credentials, source-write opt-in, or deployment action.")
          PY
      - name: Capture validation evidence envelope
        id: evidence_envelope
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install_deps.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_project.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime_assembly.outcome }}
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile_tools.outcome }}
          POLICY_OUTCOME: ${{ steps.policy_boundary.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          checks = {
              "dependency_install": os.getenv("INSTALL_OUTCOME", "unknown"),
              "jsonc_project_validation": os.getenv("VALIDATION_OUTCOME", "unknown"),
              "runtime_assembly_no_model_call": os.getenv("RUNTIME_OUTCOME", "unknown"),
              "governance_tool_tests": os.getenv("TEST_OUTCOME", "unknown"),
              "python_compile": os.getenv("COMPILE_OUTCOME", "unknown"),
              "secret_and_deployment_boundary": os.getenv("POLICY_OUTCOME", "unknown"),
          }
          passed = all(value == "success" for value in checks.values())
          report = {
              "schema_version": "AFX-CREWAI-CI-EVIDENCE-1",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "status": "PASS" if passed else "FAIL",
              "truth_state": "TESTED" if passed else "RED",
              "source": {
                  "repository": os.getenv("GITHUB_REPOSITORY", "unknown"),
                  "ref": os.getenv("GITHUB_REF", "unknown"),
                  "commit_sha": os.getenv("GITHUB_SHA", "unknown"),
                  "workflow": os.getenv("GITHUB_WORKFLOW", "unknown"),
                  "workflow_ref": os.getenv("GITHUB_WORKFLOW_REF", "unknown"),
              },
              "execution": {
                  "event": os.getenv("GITHUB_EVENT_NAME", "unknown"),
                  "run_id": os.getenv("GITHUB_RUN_ID", "unknown"),
                  "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT", "unknown"),
                  "checks": checks,
              },
              "claims": {
                  "real_model_execution": "NOT_RUN",
                  "production_readiness": "NOT_PROVEN",
              },
              "unknown_is_not_green": True,
          }
          output = Path("output")
          output.mkdir(parents=True, exist_ok=True)
          target = output / "crewai-validation-evidence.json"
          payload = (json.dumps(report, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
          target.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          (output / "SHA256SUMS").write_text(
              f"{digest}  crewai-validation-evidence.json\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          print(f"evidence_sha256={digest}")
          if not passed:
              raise SystemExit("CrewAI evidence gate is RED: one or more checks did not succeed.")
          PY
      - name: Verify evidence manifest integrity
        # Exactly one expected filename and matching SHA-256 are mandatory.
        id: verify_evidence
        if: always() && steps.evidence_envelope.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from governance import verify_evidence_manifest

          output = Path("output")
          evidence_path = output / "crewai-validation-evidence.json"
          digest = verify_evidence_manifest(
              evidence_path,
              output / "SHA256SUMS",
              expected_filename="crewai-validation-evidence.json",
          )
          report = json.loads(evidence_path.read_text(encoding="utf-8"))
          expected = {
              "schema_version": "AFX-CREWAI-CI-EVIDENCE-1",
              "status": "PASS",
              "truth_state": "TESTED",
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"evidence envelope failed closed: {key}")
          claims = report.get("claims", {})
          if claims.get("real_model_execution") != "NOT_RUN":
              raise SystemExit("evidence must not claim a real model call")
          if claims.get("production_readiness") != "NOT_PROVEN":
              raise SystemExit("evidence must not claim production readiness")
          if report.get("unknown_is_not_green") is not True:
              raise SystemExit("evidence must explicitly keep unknown states non-green")
          source = report.get("source", {})
          if source.get("repository") != os.environ.get("GITHUB_REPOSITORY"):
              raise SystemExit("evidence repository does not match this CI run")
          if source.get("commit_sha") != os.environ.get("GITHUB_SHA"):
              raise SystemExit("evidence commit SHA does not match this CI run")
          execution = report.get("execution", {})
          if execution.get("run_id") != os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("evidence workflow run ID does not match this CI run")
          if execution.get("run_attempt") != os.environ.get("GITHUB_RUN_ATTEMPT"):
              raise SystemExit("evidence workflow attempt does not match this CI run")
          checks = execution.get("checks", {})
          required_checks = {
              "dependency_install",
              "jsonc_project_validation",
              "runtime_assembly_no_model_call",
              "governance_tool_tests",
              "python_compile",
              "secret_and_deployment_boundary",
          }
          if set(checks) != required_checks or any(value != "success" for value in checks.values()):
              raise SystemExit("evidence envelope contains missing or non-success checks")
          print(f"PASS: evidence schema, truth boundary, run provenance, and SHA256 verified: {digest}")
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewai-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local_validation/output/crewai-validation-evidence.json
            local_validation/output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
