name: AFAGHX AI Brain Runtime

on:
  workflow_dispatch:
    inputs:
      task:
        description: Approved engineering mission
        required: true
        type: string
      effort:
        description: Codex reasoning effort
        required: true
        type: choice
        options: [medium, high]
        default: high

concurrency:
  group: afaghx-ai-brain-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate control plane
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/brain-runtime.yaml .ai/workflows/engineering-loop.yaml .ai/providers.yaml .ai/contracts/agent-contract.yaml .ai/contracts/module-contract.yaml; do test -f "$f"; done
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

  architect:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Architecture brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: architecture-plan.md
          prompt: |
            ROLE: AFAGHX CHIEF ARCHITECT.
            Mission: ${{ inputs.task }}
            Read AGENTS.md, .ai/brain-runtime.yaml, .ai/command-center.yaml,
            .ai/architecture/*, .ai/contracts/* and relevant repository code.
            Produce architecture-plan.md with: mission interpretation, affected
            layers/modules, dependency and ownership checks, security boundaries,
            acceptance criteria, bounded implementation scope, exact validation
            commands, risks and UNKNOWN evidence. Do not edit files. Do not claim GREEN.
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-architecture-plan-${{ github.run_id }}
          path: architecture-plan.md
          if-no-files-found: error

  planner:
    needs: architect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-architecture-plan-${{ github.run_id }}
          path: .ai/runtime
      - name: Planning brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: implementation-plan.md
          prompt: |
            ROLE: AFAGHX PLANNER.
            Mission: ${{ inputs.task }}
            Read AGENTS.md, .ai/brain-runtime.yaml and .ai/runtime/architecture-plan.md.
            Convert the architect's approved scope into a bounded implementation plan.
            Include exact files/modules to change, sequencing, tests, rollback concerns,
            contract impacts and explicit out-of-scope items. Do not edit repository files.
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-implementation-plan-${{ github.run_id }}
          path: implementation-plan.md
          if-no-files-found: error

  implement:
    needs: planner
    runs-on: ubuntu-latest
    environment: afaghx-ai-execute
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-architecture-plan-${{ github.run_id }}
          path: .ai/runtime
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-implementation-plan-${{ github.run_id }}
          path: .ai/runtime
      - name: Create isolated work branch
        id: branch
        run: |
          set -euo pipefail
          branch="ai/brain-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Implementation brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          output-file: implementation-report.md
          prompt: |
            ROLE: AFAGHX IMPLEMENTER.
            Mission: ${{ inputs.task }}
            Read AGENTS.md, .ai/brain-runtime.yaml, .ai/command-center.yaml,
            architecture maps/contracts, .ai/runtime/architecture-plan.md and
            .ai/runtime/implementation-plan.md.
            Implement ONLY the bounded plan. Add deterministic tests and required docs.
            Do not change secrets or deployment credentials. Do not bypass AFX-CORE.
            Do not commit or push. Report exact commands/results; UNKNOWN stays UNKNOWN.
      - name: Verify implementation boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse main)"
          git diff --check
          git diff --name-only | tee .ai/runtime/changed-files.txt
          test -s .ai/runtime/changed-files.txt
          ! grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)' .ai/runtime/changed-files.txt
      - name: Commit and push isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "ai: implement approved AFAGHX mission"
          git remote add push-origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream push-origin "${{ steps.branch.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-implementation-${{ github.run_id }}
          path: .ai/runtime/
          if-no-files-found: error

  validate:
    needs: implement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.implement.outputs.branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Deterministic tests
        run: |
          set -euo pipefail
          test -d core/AFX-CORE
          cd core/AFX-CORE
          npm ci --ignore-scripts
          npm test -- --runInBand
      - name: Diff integrity
        run: git diff --check main...HEAD

  security:
    needs: implement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.implement.outputs.branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Adversarial security brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.REVIEW_AI_API_KEY || secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: security-review.md
          prompt: |
            ROLE: AFAGHX INDEPENDENT SECURITY REVIEWER.
            Review main...HEAD and all relevant contracts. Do not trust implementation claims.
            Check AFX-CORE authority, authentication, authorization, tenant isolation,
            secret/token handling, injection, logging, dependency risk, fail-open and
            confused-deputy paths. Return RED, UNKNOWN or GREEN with exact evidence.
            Never approve implementation. UNKNOWN is blocking.
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-security-${{ github.run_id }}
          path: security-review.md
          if-no-files-found: error

  evidence-auditor:
    needs: [implement, validate, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.implement.outputs.branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-architecture-plan-${{ github.run_id }}
          path: evidence/architecture
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-implementation-plan-${{ github.run_id }}
          path: evidence/planning
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-implementation-${{ github.run_id }}
          path: evidence/implementation
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-security-${{ github.run_id }}
          path: evidence/security
      - name: Evidence audit brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.REVIEW_AI_API_KEY || secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: evidence-decision.md
          prompt: |
            ROLE: AFAGHX EVIDENCE AUDITOR.
            Audit all evidence artifacts and git diff main...HEAD. Verify provenance,
            completeness, baseline, changed files, architecture boundaries, tests,
            security review and contract obligations. Return RED, UNKNOWN or GREEN.
            GREEN requires successful evidence for every applicable control.
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-evidence-${{ github.run_id }}
          path: evidence-decision.md
          if-no-files-found: error

  release-gate:
    needs: [implement, validate, security, evidence-auditor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.implement.outputs.branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-security-${{ github.run_id }}
          path: gate/security
      - uses: actions/download-artifact@v4
        with:
          name: afaghx-evidence-${{ github.run_id }}
          path: gate/evidence
      - name: Release gate brain
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.REVIEW_AI_API_KEY || secrets.OPENAI_API_KEY }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: release-decision.md
          prompt: |
            ROLE: AFAGHX RELEASE GATE.
            Evaluate the complete evidence package for mission ${{ inputs.task }}.
            Any failed applicable control is RED; any unexecuted/unverifiable control is UNKNOWN.
            Only complete successful evidence may be GREEN. Do not merge or deploy.
            Produce release-decision.md with final decision and exact blocking reasons.
      - name: Enforce release decision
        run: |
          set -euo pipefail
          test -s gate/evidence/evidence-decision.md
          test -s gate/security/security-review.md
          ! grep -Eiq '^RED\b' gate/security/security-review.md
          ! grep -Eiq '^UNKNOWN\b' gate/security/security-review.md
          ! grep -Eiq '^RED\b' gate/evidence/evidence-decision.md
          ! grep -Eiq '^UNKNOWN\b' gate/evidence/evidence-decision.md
          test -s release-decision.md
          ! grep -Eiq '^RED\b|^UNKNOWN\b' release-decision.md
      - name: Create draft PR for human review
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          gh pr create --base main --head "${{ needs.implement.outputs.branch }}" \
            --title "AI Brain: ${TASK}" \
            --body "## AFAGHX AI Brain Runtime\n\nMission: ${TASK}\n\nPipeline: Architect → Planner → Implementer → Test Engineer → Security Reviewer → Evidence Auditor → Release Gate → Human Review.\n\nAuto-merge and production deployment are intentionally forbidden."
