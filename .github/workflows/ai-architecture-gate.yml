name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          # Scan implementation-bearing source trees only. Governance prose and workflow
          # policy text intentionally contains forbidden phrases as rules/examples and
          # must not be interpreted as implementation violations.
          scan_roots=()
          for d in core platform domains intelligence apps; do
            test -d "$d" && scan_roots+=("$d")
          done
          if ((${#scan_roots[@]} > 0)); then
            if grep -RInE \
              --include='*.js' --include='*.cjs' --include='*.mjs' --include='*.ts' --include='*.tsx' \
              --include='*.jsx' --include='*.json' --include='*.yaml' --include='*.yml' \
              '([A-Za-z0-9_-]+)(User|Auth|Token|Session)[[:space:]-]*(service|module|class|handler)?[[:space:]]*.*authority|bypass[[:space:]]+AFX-CORE|direct[[:space:]-]*database[[:space:]]+access' \
              "${scan_roots[@]}" | grep -vE 'prohibit|never|forbidden|must not'; then
              echo 'Potential architecture boundary violation detected.' >&2
              exit 1
            fi
          fi
      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        run: git diff --check "origin/main...HEAD"
