name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          violations="$(git grep -nIE '([A-Za-z0-9_-]+)(User|Auth|Token|Session)[^\n]*authority|direct[^\n]*database|bypass[^\n]*AFX-CORE' -- 
            'core/**/*.{js,jsx,ts,tsx,mjs,cjs}' 
            'domains/**/*.{js,jsx,ts,tsx,mjs,cjs}' 
            'platform/**/*.{js,jsx,ts,tsx,mjs,cjs}' 
            'experience/**/*.{js,jsx,ts,tsx,mjs,cjs}' 
            'infrastructure/**/*.{js,jsx,ts,tsx,mjs,cjs}' 
            'intelligence/**/*.{js,jsx,ts,tsx,mjs,cjs}' 2>/dev/null || true)"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            echo 'Potential architecture boundary violation detected in executable source.' >&2
            exit 1
          fi
      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
