name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          # Scan implementation surfaces for actual forbidden boundary constructs.
          # Governance prose is intentionally excluded to avoid policy-text false positives.
          if grep -RInE '(class|interface|type|function|const|let|var).*([Uu]ser|[Aa]uth|[Tt]oken|[Ss]ession).*authority' core domains platform experience --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' --include='*.py' --include='*.go' 2>/dev/null; then
            echo 'Potential duplicate identity/auth/token/session authority detected.' >&2
            exit 1
          fi
          if grep -RInE '(from|require\().*(database|typeorm|prisma|sequelize|mongoose)' experience domains --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' 2>/dev/null; then
            echo 'Potential direct database access from Experience/Domain surface detected.' >&2
            exit 1
          fi
      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        run: git diff --check "origin/main...HEAD"
