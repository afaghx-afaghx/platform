name: AFAGHX AI Architecture Gate

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afaghx
          POSTGRES_PASSWORD: afaghx
          POSTGRES_DB: afaghx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afaghx -d afaghx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://afaghx:afaghx@127.0.0.1:5432/afaghx_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/AFX-CORE/package-lock.json
      - name: Install locked AFX-CORE dependencies
        working-directory: core/AFX-CORE
        run: npm ci --no-audit --no-fund
      - name: Verify AFX-CORE dependency tree
        working-directory: core/AFX-CORE
        run: npm ls --all
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Validate AI assistant runtime contracts
        run: |
          set -euo pipefail
          python3 -m py_compile .ai/runtime/agent-loop.py .ai/runtime/forensics.py .ai/runtime/task_scope_guard.py .ai/runtime/task_scope_guard_contract_test.py
          python3 .ai/runtime/task_scope_guard_contract_test.py
          python3 scripts/ai/test-candidate-secret-scanner.py
          node --check scripts/ai/validate-local-provider-contract.mjs
          node scripts/ai/validate-local-provider-contract.mjs
          node --test .ai/runtime/local-provider.contract.test.mjs
          node --test .ai/runtime/golden-execution.contract.test.mjs
          node --test platform/Gateway/runtime.integration.test.mjs
          node --test .ai/runtime/ai-assistant-runtime.contract.test.mjs

      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          if grep -RInE '([A-Za-z0-9_-]+)(User|Auth|Token|Session).*authority|direct.*database|bypass.*AFX-CORE' core experience --exclude-dir=.git --exclude-dir=node_modules | grep -v 'prohibit\|never\|forbidden\|must not'; then
            echo 'Potential architecture boundary violation detected.' >&2
            exit 1
          fi
      - name: Canonical Experience registry validation
        run: node experience/validate-module-registry.mjs

      - name: Canonical architecture version validation
        run: |
          set -euo pipefail
          test -f docs/architecture/AFX-MASTER-ARCH-001-v2.0.md
          grep -q 'Status.*FINAL / CONSTITUTIONAL' docs/architecture/AFX-MASTER-ARCH-001-v2.0.md
          grep -q 'master_architecture: docs/architecture/AFX-MASTER-ARCH-001-v2.0.md' .ai/architecture/system-map.yaml
          grep -q 'AFX-MASTER-ARCH-001-v2.0.md' AGENTS.md
          grep -q 'SUPERSEDED / HISTORICAL BASELINE' docs/architecture/AFX-MASTER-ARCH-001.md
          node experience/validate-module-registry.mjs

      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        run: |
          set -euo pipefail
          # Markdown uses two trailing spaces as an intentional hard line break.
          # Keep strict diff whitespace validation for all executable/config/source files.
          git diff --check "origin/main...HEAD" -- ':!*.md' ':!**/*.md'
