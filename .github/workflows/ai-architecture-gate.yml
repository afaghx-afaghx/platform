name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          # Scan executable implementation surfaces only. Documentation and policy prose
          # legitimately contains forbidden-dependency language and must not be treated as code.
          if grep -RInE '([A-Za-z0-9_-]+)(User|Auth|Token|Session).*authority|direct.*database|bypass.*AFX-CORE' \
            core Gateway experience --exclude-dir=.git 2>/dev/null | \
            grep -vE 'prohibit|never|forbidden|must not|should not|do not|no direct'; then
            echo 'Potential architecture boundary violation detected.' >&2
            exit 1
          fi
      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation diagnostics
        run: |
          set -euo pipefail
          if ! git diff --check "origin/main...HEAD"; then
            echo 'Diff validation diagnostics: trailing whitespace or whitespace errors detected above.' >&2
          fi
      - name: Diff validation
        run: git diff --check "origin/main...HEAD"
