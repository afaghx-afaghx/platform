name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-architecture-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Required governance files
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          test "$(find .github/agents -name '*.agent.md' | wc -l)" -ge 6
          test "$(find .github/skills -name 'SKILL.md' | wc -l)" -ge 4
      - name: Architecture boundary scan
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_code < <(git diff --name-only origin/main...HEAD -- \
            '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.py' '*.go' '*.rs' '*.java' '*.kt' '*.cs' | \
            grep -vE '(^|/)(test|tests|__tests__|fixtures|mocks)(/|\.)' || true)
          if [ "${#changed_code[@]}" -eq 0 ]; then
            echo 'No changed production-code files; boundary scan not applicable.'
            exit 0
          fi
          for file in "${changed_code[@]}"; do
            if grep -nEi 'bypass[[:space:]_-]*(afx-core|auth|authorization)|direct[[:space:]_-]*database|independent[[:space:]_-]*(authentication|authorization)[[:space:]]*(authority|service)' "$file"; then
              echo "Potential architecture boundary violation in $file" >&2
              exit 1
            fi
          done
      - name: Secret and key filename scan
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        shell: bash
        run: git diff --check "origin/main...HEAD"
