name: AFAGHX AI Architecture Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Required governance files
        run: |
          set -euo pipefail
          for f in AGENTS.md .ai/command-center.yaml .ai/policies/engineering.md .ai/providers.yaml .ai/evidence/evidence-schema.yaml .ai/contracts/module-contract.yaml .ai/contracts/agent-contract.yaml; do test -f "$f" || exit 1; done
          find .github/agents -name '*.agent.md' -print | sort
          find .github/skills -name 'SKILL.md' -print | sort
      - name: Architecture boundary scan
        run: |
          set -euo pipefail
          targets=()
          for d in core intelligence platform services; do
            if [ -d "$d" ]; then targets+=("$d"); fi
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo 'No source directories available for architecture scan; required governance files remain authoritative.'
            exit 0
          fi
          if grep -RInE '([A-Za-z0-9_-]+)(User|Auth|Token|Session).*authority|direct.*database|bypass.*AFX-CORE' "${targets[@]}" \
              --exclude-dir=.git \
              --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.go' --include='*.java' --include='*.cs' \
              | grep -vE 'prohibit|never|forbidden|must[[:space:]]+not'; then
            echo 'Potential architecture boundary violation detected.' >&2
            exit 1
          fi
      - name: Secret and key filename scan
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
      - name: Diff validation
        run: git diff --check "origin/main...HEAD"
