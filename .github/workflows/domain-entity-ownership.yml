name: Domain Entity Ownership

on:
  push:
    paths:
      - 'docs/architecture/AFX-DOMAIN-MAP-001.md'
      - 'docs/architecture/AFX-DOMAIN-ENTITY-OWNERSHIP-001.yaml'
      - 'scripts/architecture/verify-domain-entity-ownership.rb'
      - '.github/workflows/domain-entity-ownership.yml'
  pull_request:
    paths:
      - 'docs/architecture/AFX-DOMAIN-MAP-001.md'
      - 'docs/architecture/AFX-DOMAIN-ENTITY-OWNERSHIP-001.yaml'
      - 'scripts/architecture/verify-domain-entity-ownership.rb'
      - '.github/workflows/domain-entity-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify domain entity ownership
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ownership verifier
        run: ruby scripts/architecture/verify-domain-entity-ownership.rb

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-entity-ownership-evidence
          path: evidence/domain-entity-ownership/ownership-verification.json
          if-no-files-found: error
