name: AFAGHX AI Control Plane — Fast Local Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  local-contracts:
    name: Fast Local Contracts
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate governed task
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/providers.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/local-provider.contract.test.mjs
          python3 -m json.tool .ai/tasks/queue.json >/dev/null
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
          git diff --check

      - name: Run Local Provider contract
        run: node --test .ai/runtime/local-provider.contract.test.mjs

      - name: Run GPT-5.6 governance contract without calling provider
        run: node --test .ai/runtime/gpt56-provider.contract.test.mjs

      - name: Run Golden Execution governance contract without calling provider
        run: node --test .ai/runtime/golden-execution.contract.test.mjs

      - name: Run repository forensics
        run: python3 .ai/runtime/forensics.py

      - name: Build immutable TESTED evidence
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          printf 'mode=local-validation\ntruth_state=TESTED\npaid_provider_required=false\n' > agent-evidence/fast-local-context.txt
          git rev-parse HEAD > agent-evidence/head-sha.txt
          git diff --check > agent-evidence/diff-check.txt

      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-fast-local-validation-${{ github.run_id }}
          path: agent-evidence/
          if-no-files-found: error

  final-gate:
    name: Fast Local Final Gate
    needs: local-contracts
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - name: Enforce TESTED truth state
        env:
          VALIDATION: ${{ needs.local-contracts.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION" = success
          echo "AFX-AI-CEA-001 LOCAL FINAL GATE: TESTED"
          echo "PROVEN remains blocked until real GPT-5.6 golden execution evidence exists."
