name: AFAGHX AI Engineering Command Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options: [plan, audit, execute]
        default: plan
      task:
        description: Approved engineering task
        required: true
        type: string
      model:
        description: Optional model override
        required: false
        type: string
        default: ''
      effort:
        description: Reasoning effort
        required: true
        type: choice
        options: [low, medium, high]
        default: high

concurrency:
  group: afaghx-ai-command-center
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Capture baseline
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/policies/engineering.md
          test -f .ai/architecture/system-map.yaml
          test -f .ai/architecture/module-map.yaml
          test -f .ai/contracts/module-contract.yaml
          test -f .ai/evidence/evidence-schema.yaml
          test -f .ai/providers.yaml
      - name: Repository integrity checks
        run: |
          set -euo pipefail
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

  plan-or-audit:
    needs: preflight
    if: ${{ inputs.mode != 'execute' }}
    runs-on: ubuntu-latest
    environment: afaghx-ai-execute
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Normalize OpenAI API key
        env:
          OPENAI_API_KEY_RAW: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          key="$(printf '%s' "$OPENAI_API_KEY_RAW" | tr -d '\r\n')"
          test -n "$key"
          case "$key" in
            sk-*) ;;
            *) echo 'OPENAI_API_KEY does not have the expected prefix.' >&2; exit 1 ;;
          esac
          printf 'OPENAI_API_KEY_NORMALIZED=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Run governed analysis
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY_NORMALIZED }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: command-center-report.md
          prompt: |
            Act as AFAGHX Command Center in ${{ inputs.mode }} mode.
            Read AGENTS.md, .ai/command-center.yaml, .ai/policies/engineering.md, .ai/architecture/*, .ai/contracts/* and the repository.
            Task: ${{ inputs.task }}
            Do not mutate files. Do not invent GREEN. Explicitly classify unavailable evidence as UNKNOWN.
            Report baseline SHA, inventory, architecture impact, security risks, affected files, exact validation commands, acceptance criteria and next action.
      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-command-center-${{ inputs.mode }}
          path: command-center-report.md
          if-no-files-found: error

  execute:
    needs: preflight
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    environment: afaghx-ai-execute
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Capture baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Normalize OpenAI API key
        env:
          OPENAI_API_KEY_RAW: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          key="$(printf '%s' "$OPENAI_API_KEY_RAW" | tr -d '\r\n')"
          test -n "$key"
          case "$key" in
            sk-*) ;;
            *) echo 'OPENAI_API_KEY does not have the expected prefix.' >&2; exit 1 ;;
          esac
          printf 'OPENAI_API_KEY_NORMALIZED=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Governed implementation
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY_NORMALIZED }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          output-file: command-center-report.md
          prompt: |
            You are the AFAGHX governed implementation agent.
            Baseline: ${{ steps.baseline.outputs.sha }}
            Task: ${{ inputs.task }}
            Read AGENTS.md, .ai/command-center.yaml, .ai/policies/engineering.md and all relevant architecture/contracts.
            Implement only the approved task. Do not commit, push, deploy, alter secrets, or bypass AFX-CORE.
            Add deterministic tests and documentation where required. Run applicable tests and report exact commands/results.
            Never call UNKNOWN GREEN.
      - name: Enforce workspace boundary
        id: changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.baseline.outputs.sha }}"
          git diff --check
          git diff --name-only | tee changed-files.txt
          test -s changed-files.txt
          if grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)' changed-files.txt; then exit 1; fi
          if grep -Eq '^\.git/|(^|/)node_modules/' changed-files.txt; then exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Secret scan
        run: |
          set -euo pipefail
          if git diff --cached --exit-code >/dev/null 2>&1; then :; fi
          ! git diff --binary | grep -Eiq '(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|ghp_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,})'
      - name: Validate AFX-CORE
        run: |
          set -euo pipefail
          cd core/AFX-CORE
          npm ci --ignore-scripts
          npm test -- --runInBand
      - name: Dependency audit
        run: |
          set -euo pipefail
          cd core/AFX-CORE
          npm audit --audit-level=high
      - name: Evidence manifest
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --name-status > evidence/changed-files-manifest.txt
          git rev-parse HEAD > evidence/baseline-sha.txt
          printf 'mode=%s\ntask=%s\n' '${{ inputs.mode }}' '${{ inputs.task }}' > evidence/run-context.txt
          git diff --check > evidence/diff-check.txt
      - name: Create PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          branch="ai/$(date -u +%Y%m%d-%H%M%S)-command-center"
          git switch -c "$branch"
          git add -A
          git diff --cached --check
          git commit -m "ai: execute approved command center task"
          git remote add push-origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream push-origin "$branch"
          gh pr create --base main --head "$branch" --title "AI Engineering Command Center: ${TASK}" --body-file command-center-report.md
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: afaghx-command-center-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
