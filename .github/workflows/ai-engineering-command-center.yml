name: AFAGHX AI Engineering Command Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options: [plan, audit, execute]
        default: plan
      task:
        description: Approved engineering task
        required: true
        type: string
      model:
        description: Optional model override
        required: false
        type: string
        default: ''
      effort:
        description: Reasoning effort
        required: true
        type: choice
        options: [low, medium, high]
        default: high

concurrency:
  group: afaghx-ai-command-center
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Capture immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "baseline=$(git rev-parse HEAD)"
          for required in \
            AGENTS.md \
            .ai/command-center.yaml \
            .ai/policies/engineering.md \
            .ai/architecture/system-map.yaml \
            .ai/architecture/module-map.yaml \
            .ai/contracts/module-contract.yaml \
            .ai/contracts/agent-contract.yaml \
            .ai/evidence/evidence-schema.yaml \
            .ai/providers.yaml; do
            test -f "$required"
          done
      - name: Repository integrity checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'

  plan-or-audit:
    needs: preflight
    if: ${{ inputs.mode != 'execute' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Run governed analysis
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: command-center-report.md
          prompt: |
            Act as AFAGHX Command Center in ${{ inputs.mode }} mode.
            Read AGENTS.md, .ai/command-center.yaml, .ai/policies/engineering.md, .ai/architecture/*, .ai/contracts/* and the repository.
            Task: ${{ inputs.task }}
            Do not mutate files. Do not invent GREEN. Explicitly classify unavailable evidence as UNKNOWN.
            Report baseline SHA, inventory, architecture impact, security risks, affected files, exact validation commands, acceptance criteria and next action.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afaghx-command-center-${{ inputs.mode }}
          path: command-center-report.md
          if-no-files-found: error

  execute:
    needs: preflight
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    environment: afaghx-ai-execute
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Capture baseline
        id: baseline
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Governed implementation
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          output-file: command-center-report.md
          prompt: |
            You are the AFAGHX governed implementation agent.
            Baseline: ${{ steps.baseline.outputs.sha }}
            Task: ${{ inputs.task }}
            Read AGENTS.md, .ai/command-center.yaml, .ai/policies/engineering.md and all relevant architecture/contracts.
            Implement only the approved task. Do not commit, push, deploy, alter secrets, or bypass AFX-CORE.
            Add deterministic tests and documentation where required. Run applicable tests and report exact commands/results.
            Never call UNKNOWN GREEN.
      - name: Enforce workspace boundary and capture changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.baseline.outputs.sha }}"
          git diff --check
          git status --porcelain=v1 | tee workspace-status.txt
          git add -A
          git diff --cached --check
          git diff --cached --name-status | tee changed-files.txt
          test -s changed-files.txt
          if grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)' changed-files.txt; then
            echo 'Potential secret/key file detected.' >&2
            exit 1
          fi
          if grep -Eq '(^|/)node_modules/|^\.git/' changed-files.txt; then
            echo 'Generated repository metadata detected.' >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --binary | grep -Eiq '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})'; then
            echo 'Potential credential detected in staged changes.' >&2
            exit 1
          fi
      - name: Validate AIECC structural contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/aiecc/command-center.test.mjs
      - name: Validate AFX-CORE
        shell: bash
        run: |
          set -euo pipefail
          cd core/AFX-CORE
          npm ci --ignore-scripts
          npm test -- --test-reporter=spec
      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          cd core/AFX-CORE
          npm audit --audit-level=high
      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --cached --name-status > evidence/changed-files-manifest.txt
          git rev-parse HEAD > evidence/baseline-sha.txt
          printf 'run_id=%s\ntimestamp=%s\nmode=%s\ntask=%s\n' \
            '${{ github.run_id }}' \
            '${{ github.run_started_at }}' \
            '${{ inputs.mode }}' \
            '${{ inputs.task }}' > evidence/run-context.txt
          git diff --cached --check > evidence/diff-check.txt
          printf 'command=node --test tests/aiecc/command-center.test.mjs\nexit_code=0\nworkflow_run=${{ github.run_id }}\nartifact_or_log_reference=afaghx-command-center-evidence-${{ github.run_id }}\n' > evidence/aiecc-structural-validation.txt
      - name: Create isolated branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ai/$(date -u +%Y%m%d-%H%M%S)-command-center"
          git switch -c "$branch"
          git diff --cached --check
          git commit -m "ai: execute approved command center task"
          git remote add push-origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream push-origin "$branch"
          gh pr create --base main --head "$branch" --title "AI Engineering Command Center: ${TASK}" --body-file command-center-report.md
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afaghx-command-center-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
