name: Gate 01 Abuse Security
on:
  pull_request:
    paths:
      - 'platform/Gateway/**'
      - 'core/AFX-CORE/**'
      - '.github/workflows/gate-01-abuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-01-abuse:
    name: gate-01-abuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Abuse controls
        run: node --test platform/Gateway/security-boundary.test.js
