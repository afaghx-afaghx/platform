name: AFAGHX AI Control Plane — Zero-Cost Local Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Governed local validation task
        required: true
        type: string
        default: AFX-LOCAL-001

concurrency:
  group: afaghx-ai-local-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-validation:
    name: Local Control Plane Validation
    runs-on: ubuntu-slim
    env:
      TASK_ID: AFX-LOCAL-001
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate task and protected boundaries
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .ai/command-center.yaml
          test -f .ai/providers.yaml
          test -f .ai/tasks/queue.json
          test -f .ai/runtime/local-provider.contract.test.mjs
          python3 -m json.tool .ai/tasks/queue.json >/dev/null
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|id_rsa$)'
          git diff --check

      - name: Install AFX-CORE test dependencies
        working-directory: core/AFX-CORE
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run local provider contract
        run: node --test .ai/runtime/local-provider.contract.test.mjs

      - name: Run GPT-5.6 governance contract without calling the provider
        run: node --test .ai/runtime/gpt56-provider.contract.test.mjs

      - name: Run canonical Gateway runtime contract
        run: node --test platform/Gateway/runtime.integration.test.mjs

      - name: Run AFX-CORE security suite
        working-directory: core/AFX-CORE
        run: npm run test:security

      - name: Run repository forensics
        run: python3 .ai/runtime/forensics.py

      - name: Build local evidence
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          printf 'task=%s\nmode=local-validation\ntruth_state=TESTED\npaid_provider_required=false\n' "$TASK_ID" > agent-evidence/local-validation-context.txt
          git rev-parse HEAD > agent-evidence/baseline-sha.txt
          git diff --check > agent-evidence/diff-check.txt

      - uses: actions/upload-artifact@v4
        with:
          name: afaghx-local-validation-${{ github.run_id }}
          path: agent-evidence/
          if-no-files-found: error

  final-gate:
    name: Local Validation Final Gate
    needs: local-validation
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - name: Enforce local truth state
        env:
          VALIDATION: ${{ needs.local-validation.result }}
        run: |
          set -euo pipefail
          echo "validation=$VALIDATION"
          test "$VALIDATION" = success
          echo "AFX-AI-CEA-001 LOCAL GATE: TESTED"
          echo "PROVEN requires a separate real GPT-5.6 golden execution."
