version: 2
name: AFAGHX-AI-ENGINEERING-COMMAND-CENTER
mode: evidence-first

repository:
  canonical: afaghx-afaghx/platform
  default_branch: main
  protected_branch: main

architecture:
  source_of_truth: AGENTS.md
  layers: [AFX-CORE, AFX-PLATFORM, DOMAIN, INTELLIGENCE, EXPERIENCE, INFRASTRUCTURE, ENGINEERING-GOVERNANCE]
  request_flow: Authentication -> Identity -> Tenant Context -> Membership -> RBAC/Permission -> Policy -> Resource State

agent:
  id: AFX-AI-CEA-001
  name: AFAGHX-Chief-Engineering-Agent
  provider: local-ollama
  fallback_provider: openai-codex
  paid_provider_required: false
  default_mode: golden-execution
  modes: [forensics, architect, plan, implement, security, verify, evidence, remediate, release-gate]
  execution_requires: [explicit_task, real_model, isolated_workspace, deterministic_tests, evidence, pull_request, human_review_before_merge]

change_policy:
  direct_push_to_main: false
  destructive_operations: denied
  secret_changes: denied
  production_changes: approval_required
  dependency_changes: review_required
  schema_migrations: rollback_plan_required
  architecture_changes: adr_required

truth_states: [IMPLEMENTED, TESTED, PROVEN, PRODUCTION_READY]
unknown_is_not_green: true

stop_conditions:
  - authentication_boundary_violation
  - tenant_isolation_violation
  - secret_detected
  - missing_test_evidence
  - main_branch_write_attempt
  - architecture_authority_conflict
  - unverifiable_green_claim