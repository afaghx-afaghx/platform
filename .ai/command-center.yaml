version: 2
name: AFAGHX-AI-ENGINEERING-COMMAND-CENTER
mode: evidence-first

repository:
  canonical: afaghx-afaghx/platform
  default_branch: main
  protected_branch: main

architecture:
  source_of_truth: AGENTS.md
  layers:
    - AFX-CORE
    - AFX-PLATFORM
    - DOMAIN
    - INTELLIGENCE
    - EXPERIENCE
    - INFRASTRUCTURE
    - ENGINEERING-GOVERNANCE
  request_flow: Authentication -> Identity -> Tenant Context -> Membership -> RBAC/Permission -> Policy -> Resource State

agent:
  id: AFX-AI-CEA-001
  name: AFAGHX-Chief-Engineering-Agent
  model_policy: provider-agnostic
  modes:
    - forensics
    - architect
    - plan
    - implement
    - security
    - verify
    - evidence
    - remediate
    - release-gate
  team_perspectives:
    - architecture-core
    - security-trust
    - platform-runtime
    - experience-product
  default_mode: plan
  execution_mode_requires:
    - explicit_or_queue_task_selection
    - successful_baseline_validation
    - isolated_work_branch
    - real_model_runtime
    - deterministic_task_gate
    - pull_request_output
    - human_review_before_merge

change_policy:
  direct_push_to_main: false
  destructive_operations: denied
  secret_changes: denied
  production_changes: approval_required
  dependency_changes: review_required
  schema_migrations: rollback_plan_required
  architecture_changes: adr_required

required_evidence:
  - baseline_sha
  - repository_inventory
  - architecture_boundary_check
  - security_gate_results
  - tests
  - contract_validation
  - secret_scan
  - dependency_scan
  - changed_files_manifest
  - pull_request
  - rollback_strategy_when_applicable

truth_states:
  - IMPLEMENTED
  - TESTED
  - PROVEN
  - PRODUCTION_READY
  unknown_is_not_green: true

stop_conditions:
  - authentication_boundary_violation
  - tenant_isolation_violation
  - secret_detected
  - missing_test_evidence
  - unreviewed_destructive_change
  - main_branch_write_attempt
  - architecture_authority_conflict
  - unverifiable_green_claim
