version: 1
name: AFAGHX-AI-PROVIDER-REGISTRY
principle: model-agnostic-provider-abstraction
providers:
  mock:
    role: deterministic_offline_validation
    authority: none
    secret_ref: none
    allowed_modes: [plan, audit]
    network_access: false
    api_credits_required: false
  openai-codex:
    role: primary_reasoning_implementation
    authority: none
    secret_ref: OPENAI_API_KEY
    api: responses
    default_model: gpt-5.6-luna
    allowed_modes: [plan, audit, execute]
    network_access: true
    api_credits_required: true
  aodex:
    role: execution_specialist
    authority: none
    secret_ref: AODEX_API_KEY
    allowed_modes: [plan, execute]
  independent-reviewer:
    role: adversarial_review
    authority: none
    secret_ref: REVIEW_AI_API_KEY
    allowed_modes: [audit, review]
routing:
  architecture: [openai-codex, independent-reviewer]
  implementation: [openai-codex, aodex]
  security: [independent-reviewer, openai-codex]
  testing: [aodex, independent-reviewer]
  release: [independent-reviewer]
  offline_validation: [mock]
independence:
  implementation_provider_cannot_be_final_reviewer: true
  provider_credentials_never_stored_in_repo: true
  provider_failure_must_be_explicit: true
  mock_provider_cannot_be_final_reviewer: true
