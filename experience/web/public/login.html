<!doctype html>

<header class="site-header" aria-label="AFAGHX header">

    <a class="header-item language" href="#language" aria-label="Language / زبان"><span class="item-label">Language</span><strong>EN / فارسی⌄</strong></a>
    <nav class="main-nav" aria-label="Navigation / منوی اصلی">

<main class="content">

    <form id="login-form">

      <label>رمز عبور<input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
      <button class="primary-button" type="submit">ورود</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="/app.js" defer></script>
