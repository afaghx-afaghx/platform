<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>ورود | AFAGHX</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand" aria-label="AFAGHX">
      <div class="brand-mark">A</div>
      <span>AFAGHX</span>
      <h1>دروازه ورود به اکوسیستم هوشمند</h1>
      <p>یک هویت، چند سازمان، یک تجربه یکپارچه برای تجارت، صنعت و خدمات.</p>
      <div class="trust-row"><span>● امنیت‌محور</span><span>● سازمان‌محور</span><span>● API-first</span></div>
    </section>

    <section class="auth-card" aria-labelledby="login-title">
      <div class="eyebrow">خوش آمدید</div>
      <h2 id="login-title">ورود به AFAGHX</h2>
      <p class="muted">برای ادامه، اطلاعات حساب خود را وارد کنید.</p>
      <form id="login-form" novalidate>
        <label>ایمیل<input name="email" type="email" autocomplete="username" placeholder="name@company.com" required></label>
        <label>رمز عبور<input name="password" type="password" autocomplete="current-password" minlength="12" placeholder="حداقل ۱۲ کاراکتر" required></label>
        <div class="form-meta"><span>نشست امن با کوکی محافظت‌شده</span><a href="#">بازیابی رمز</a></div>
        <button class="primary" type="submit"><span>ورود به اکوسیستم</span><span aria-hidden="true">←</span></button>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <footer class="page-footer">AFAGHX · Intelligent Digital Ecosystem</footer>
  <script src="/app.js" defer></script>
</body>
</html>
