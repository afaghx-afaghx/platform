openapi: 3.1.0
info:
  title: AFAGHX AFA CODE Product Identifier API
  version: 1.0.0
  description: >
    Proposed product-domain API contract. Authentication and authorization are
    enforced by the canonical AFAGHX API/Gateway and AFX-CORE. A syntactically
    valid external identifier is not proof of ownership, authenticity, or compliance.
servers:
  - url: https://api.afaghx.com
security:
  - bearerAuth: []
paths:
  /v1/products/{productId}/external-identifiers:
    post:
      operationId: registerProductExternalIdentifier
      summary: Register an external identifier association for a product
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalIdentifierInput'
      responses:
        '201':
          description: Association created in pending-verification state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIdentifier'
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Not authorized for this product }
        '404': { description: Product not found }
        '409': { description: Conflicting identifier association }
        '422': { description: Scheme-specific validation failed }
    get:
      operationId: listProductExternalIdentifiers
      summary: List authorized external identifier associations for a product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Authorized identifier associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalIdentifier'
        '401': { description: Unauthenticated }
        '403': { description: Not authorized for this product }
        '404': { description: Product not found }
  /v1/external-identifiers/{associationId}/verification:
    post:
      operationId: submitExternalIdentifierVerificationDecision
      summary: Record an authorized verification decision
      parameters:
        - $ref: '#/components/parameters/AssociationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reasonCode]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected, needs_information, suspended, revoked]
                reasonCode:
                  type: string
                  minLength: 2
                  maxLength: 64
                evidenceDocumentIds:
                  type: array
                  items:
                    type: string
                    minLength: 8
                    maxLength: 160
                  maxItems: 50
      responses:
        '200': { description: Decision recorded with audit reference }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Reviewer permission required }
        '404': { description: Association not found }
        '409': { description: Invalid lifecycle transition }
        '422': { description: Required evidence missing or invalid }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        pattern: '^AFA-PRD-[A-Za-z0-9_-]{16,64}$'
    AssociationId:
      name: associationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^AFA-[A-Z]{2,3}-[A-Za-z0-9_-]{16,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    ExternalIdentifierInput:
      type: object
      additionalProperties: false
      required: [scheme, value]
      properties:
        scheme:
          type: string
          enum: [GTIN, LEGAL_REGISTRATION, TAX_ID, OTHER]
        value:
          type: string
          minLength: 1
          maxLength: 128
        issuingAuthority:
          type: string
          maxLength: 160
        jurisdiction:
          type: string
          maxLength: 64
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        evidenceDocumentIds:
          type: array
          items:
            type: string
            minLength: 8
            maxLength: 160
          maxItems: 50
    ExternalIdentifier:
      allOf:
        - $ref: '#/components/schemas/ExternalIdentifierInput'
        - type: object
          required: [associationId, productId, verificationStatus, createdAt]
          properties:
            associationId:
              type: string
              pattern: '^AFA-[A-Z]{2,3}-[A-Za-z0-9_-]{16,64}$'
            productId:
              type: string
              pattern: '^AFA-PRD-[A-Za-z0-9_-]{16,64}$'
            verificationStatus:
              type: string
              enum: [pending, under_review, verified, rejected, suspended, revoked]
            createdAt:
              type: string
              format: date-time
